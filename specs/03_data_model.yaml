  # ---
  # Telegram Integration (Long Polling)
  # ---
  TelegramChatMapping:
    description: >
      Maps a Telegram chat_id to a registered user account.
      Used by the api-gateway polling worker to route inbound Telegram messages
      to the correct user and forward them to the AI Analyst.
    table_name: "telegram_chat_mappings"
    indexes:
      - fields: ["user_id"]
      - fields: ["chat_id"]
        unique: true
    fields:
      - name: id
        type: integer
        primary_key: true
        description: "Auto-increment surrogate key"
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        on_delete: CASCADE
        required: true
        unique: true
        description: "Owner of this Telegram mapping"
      - name: chat_id
        type: bigint
        required: true
        unique: true
        description: "Telegram chat ID (personal or group)"
      - name: linked_at
        type: datetime
        default: "now()"
        description: "Timestamp when the account was linked"
      - name: is_active
        type: boolean
        default: true
        description: "If false, polling worker will ignore this mapping"

  ApiKey:
    description: "External API access keys for 3rd party partners"
    table_name: "api_keys"
    indexes:
      - fields: ["api_key"]
        unique: true
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: name
        type: string
        required: true
        max_length: 100
        description: "Label for the key (e.g., 'Alpha Bot')"
      - name: api_key
        type: string
        required: true
        unique: true
        max_length: 100
      - name: api_secret
        type: string
        required: true
        description: "HMAC Secret (Encrypted in DB)"
      - name: last_used_at
        type: datetime
        nullable: true
      - name: is_active
        type: boolean
        default: true
      - name: created_at
        type: datetime
        default: "now()"

  # --- Phase 58: AI Risk Rebalance Audit ---
  RebalanceHistory:
    description: "Audit trail of AI-driven risk rebalancing events"
    table_name: "rebalance_history"
    indexes:
      - fields: ["fund_id"]
      - fields: ["created_at"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        required: true
      - name: trigger_type
        type: string
        required: true
        max_length: 30
        description: "MANUAL | AUTONOMOUS | SENTIMENT_DRIFT"
      - name: drift_score
        type: float
        nullable: true
        description: "Sentiment drift magnitude that triggered the rebalance"
      - name: previous_config
        type: jsonb
        required: true
        description: "Snapshot of risk config before rebalance"
      - name: applied_config
        type: jsonb
        required: true
        description: "Snapshot of risk config after rebalance"
      - name: reasoning
        type: text
        required: true
        description: "AI reasoning for the recommendation"
      - name: applied_by
        type: string
        required: true
        max_length: 100
        description: "User ID or SYSTEM for autonomous applies"
      - name: created_at
        type: datetime
        default: "now()"
  EpisodicMemory:
    description: "Persistent AI 'lessons learned' and episodic context (The Experience)"
    table_name: "memories"
    indexes:
      - fields: ["user_id"]
      - fields: ["fund_id"]
      - fields: ["symbol"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
        description: "The user who 'learned' this memory (Isolation)"
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        nullable: true
        description: "If provided, memory is shared within the fund"
      - name: symbol
        type: string
        max_length: 20
        nullable: true
        description: "Specific market symbol context (e.g., 'XAU/USD')"
      - name: timeframe
        type: string
        max_length: 10
        nullable: true
      - name: content
        type: text
        required: true
        description: "The narrative 'lesson' or technical context"
      - name: embedding
        type: "vector(1536)"
        description: "Gemini embedding for semantic retrieval"
      - name: intent
        type: string
        nullable: true
        description: "The intent during which this memory was created (e.g. STRATEGY_EXPLAIN)"
      - name: metadata
        type: jsonb
        default: "{}"
        description: "Extra context (session_id, strategy_id, logic_version)"
      - name: created_at
        type: datetime
        default: "now()"
