# MTF Trading System - Data Model Specification (v1.0)
# Last Validated: 2026-03-11 (Matches Codebase)
# This is the source of truth for all database entities and their relationships
# All Pydantic models and Alembic migrations must align with this specification

entities:
  User:
    description: "System users (Traders, Admins, etc.)"
    table_name: "users"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: username
        type: string
        required: true
        unique: true
        max_length: 50
      - name: email
        type: string
        required: true
        unique: true
        max_length: 100
      - name: password_hash
        type: string
        required: true
      - name: is_active
        type: boolean
        default: true
      - name: is_superuser
        type: boolean
        default: false
      - name: created_at
        type: datetime
        default: "now()"
      - name: avatar_url
        type: string
        nullable: true
        description: "URL to user profile picture"
      - name: reputation_score
        type: integer
        default: 0
        description: "Gamified score based on strategy performance and community contribution"
      - name: is_verified_quant
        type: boolean
        default: false
        description: "True if user has passed the Proving Ground with at least one strategy"

  Fund:
    description: "Quant Fund or Trading Group"
    table_name: "funds"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: name
        type: string
        required: true
        max_length: 100
      - name: description
        type: text
        nullable: true
      - name: is_active
        type: boolean
        default: true
      - name: created_at
        type: datetime
        default: "now()"
      # Risk Settings (Advanced Risk Parameters moved from UserPreferences)
      - name: strategy_type
        type: enum
        enum_values: ["MTF_SMC_BASIC", "LONG_SHORT_EQUITY", "MACRO_TACTICAL", "MULTI_ASSET"]
        default: "MTF_SMC_BASIC"
        required: true
      - name: max_risk_per_trade
        type: decimal
        precision: 10
        scale: 2
        default: 10.00
        required: true
      - name: risk_percentage
        type: decimal
        precision: 5
        scale: 4
        default: 0.01
        required: true
        description: "Dynamic risk per trade as % of NAV (e.g. 0.01 = 1%)"
      - name: default_lot_size
        type: decimal
        precision: 10
        scale: 2
        default: 0.01
        required: true
        description: "Default lot size (e.g. 0.01). Broker units are standardized using a 100,000 divisor (100,000 units = 1.0 lot)."
      - name: max_drawdown_threshold
        type: decimal
        precision: 10
        scale: 2
        nullable: true
      - name: max_portfolio_beta
        type: decimal
        precision: 5
        scale: 2
        default: 0.35
        nullable: true
      - name: gross_exposure_limit
        type: decimal
        precision: 5
        scale: 2
        default: 100.00
        nullable: true
      - name: net_exposure_limit
        type: decimal
        precision: 5
        scale: 2
        default: 15.00
        nullable: true
      - name: position_limit_single
        type: decimal
        precision: 5
        scale: 2
        default: 3.00
        nullable: true
      - name: position_limit_sector
        type: decimal
        precision: 5
        scale: 2
        default: 10.00
        nullable: true
      - name: asset_classes
        type: jsonb
        default: '["FX"]'
        required: true
      - name: risk_parity_enabled
        type: boolean
        default: false
        description: "Whether Portfolio Risk Parity is enabled"
      - name: risk_parity_model
        type: enum
        enum_values: ["MIN_VOL", "HRP", "ERC"]
        default: "HRP"
        description: "Model used for Risk Parity calculation"
      - name: scale_factor
        type: decimal
        precision: 5
        scale: 4
        default: 1.0000
        required: true
        description: "Institutional risk multiplier (e.g. 1.25 = 125% risk)"
      - name: asset_risk_caps
        type: jsonb
        default: "{}"
        required: true
        description: "Per-asset risk limits (e.g. {'XAUUSD': 0.02})"

  UserFund:
    description: "Many-to-Many relationship between Users and Funds with Roles"
    table_name: "user_funds"
    indexes:
      - fields: ["user_id", "fund_id"]
        unique: true
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        required: true
      - name: role
        type: enum
        enum_values: ["OWNER", "MANAGER", "TRADER", "VIEWER"]
        required: true

  MarketCategory:
    description: "Category of market symbols (e.g., Forex, Crypto, Indices)"
    table_name: "market_categories"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: name
        type: string
        required: true
        unique: true
      - name: order_index
        type: integer
        default: 0
      - name: is_active
        type: boolean
        default: true

  MarketSymbol:
    description: "Tradable instrument definition"
    table_name: "market_symbols"
    indexes:
      - fields: ["symbol"]
        unique: true
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: category_id
        type: uuid
        foreign_key: "market_categories.id"
        required: true
      - name: data_source_id
        type: uuid
        foreign_key: "data_sources.id"
        nullable: true
      - name: symbol
        type: string
        required: true
        description: "Unified symbol identifier (e.g., 'EUR_USD')"
      - name: display_name
        type: string
        nullable: true
      - name: order_index
        type: integer
        default: 0
      - name: is_active
        type: boolean
        default: true
      - name: details
        type: jsonb
        nullable: true
        description: >-
          Broker-specific instrument metadata. Standardized JSON structure: 
          - OANDA: {digits, pipPosition, minLot, maxLot, stepVolume, raw: {...}}
          - cTrader: {digits, pipPosition, minLot, maxLot, step_volume, symbol_id, lot_size, raw: {...}}
          - Binance: {baseAsset, quoteAsset, pricePrecision, quantityPrecision, lotSize, minQty, maxQty, stepSize, raw: {...}}
          Synced from broker API (e.g. cTrader, OANDA).


  Strategy:
    description: "Active Strategy Instance (Fleet Member)"
    table_name: "strategies"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        required: true
      - name: name
        type: string
        required: true
        max_length: 100
      - name: template_id
        type: string
        required: true
        description: "Identifier for the strategy logic template (e.g., 'SMC_V1')"
      - name: config_id
        type: uuid
        foreign_key: "strategy_configs.id"
        nullable: true
        description: "Link to standardized StrategyConfig (replaces ad-hoc config_json)"
      - name: broker_account_id
        type: uuid
        foreign_key: "broker_accounts.id"
        required: true
        description: "The portfolio/account where trades will be executed"
      - name: config_json
        type: jsonb
        required: true
        description: "Strategy-specific configuration parameters (overrides template defaults)"
      - name: risk_settings
        type: jsonb
        required: true
        default: "{}"
        description: "Instance-specific risk configuration (e.g., max_risk_usd)"
      - name: custom_code
        type: text
        nullable: true
        description: "User-defined Python code for dynamic strategies"
      - name: is_active
        type: boolean
        default: false
      - name: is_shadow
        type: boolean
        default: false
        description: "If true, signals are processed fully but not sent to the broker"
      - name: last_backtest_result
        type: jsonb
        nullable: true
      - name: last_optimization_result
        type: jsonb
        nullable: true
      - name: last_simulation_result
        type: jsonb
        nullable: true
      - name: created_at
        type: datetime
        default: "now()"

  StrategyConfig:
    description: "Standardized JSON configuration for a trading strategy (The Logic)"
    table_name: "strategy_configs"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: name
        type: string
        required: true
        max_length: 100
      - name: author_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: logic_schema_version
        type: string
        default: "1.0.0"
      - name: logic_blocks
        type: jsonb
        required: true
        description: "List of logic blocks (e.g., TREND_AMA, STRUCT_SMC)"
      - name: parameters
        type: jsonb
        required: true
        description: "Global parameters for the blocks"
      - name: timeframe_settings
        type: jsonb
        required: true
        description: "Timeframes used (e.g., execution=15m, trend=4H)"
      - name: is_public
        type: boolean
        default: false
      - name: created_at
        type: datetime
        default: "now()"

  StrategyValidation:
    description: "Walk-Forward Analysis results (The Proof)"
    table_name: "strategy_validations"
    indexes:
      - fields: ["config_id"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: config_id
        type: uuid
        foreign_key: "strategy_configs.id"
        required: true
      - name: robustness_score
        type: integer
        required: true
        description: "0-100 Score based on Train/Test deviation"
      - name: sharpe_train
        type: decimal
        precision: 5
        scale: 2
      - name: sharpe_test
        type: decimal
        precision: 5
        scale: 2
      - name: car_train
        type: decimal
        precision: 5
        scale: 2
      - name: car_test
        type: decimal
        precision: 5
        scale: 2
      - name: max_dd_train
        type: decimal
        precision: 5
        scale: 2
      - name: max_dd_test
        type: decimal
        precision: 5
        scale: 2
      - name: validation_date
        type: datetime
        default: "now()"
      - name: is_passed
        type: boolean
        default: false

  PortfolioAllocation:
    description: "Risk Parity allocation for a fund"
    table_name: "portfolio_allocations"
    indexes:
      - fields: ["fund_id", "strategy_id"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        required: true
      - name: strategy_id
        type: uuid
        foreign_key: "strategies.id"
        required: true
      - name: weight
        type: decimal
        precision: 5
        scale: 4
        required: true
        description: "Allocated weight (0.0 to 1.0)"
      - name: volatility_target
        type: decimal
        precision: 5
        scale: 2
        nullable: true
      - name: last_rebalance
        type: datetime
        default: "now()"

  MentalHandHistory:
    description: "Structured psychological reflection (The Coach)"
    table_name: "mental_hand_histories"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: journal_entry_id
        type: uuid
        foreign_key: "journal_entries.id"
        description: "Link to specific trade context"
      - name: pre_trade_emotion
        type: string
        max_length: 50
        description: "Emotion before execution (e.g., 'Anxious')"
      - name: trigger_event
        type: string
        description: "What triggered the emotion?"
      - name: irrational_thought
        type: text
        description: "What was the internal narrative?"
      - name: behavioral_result
        type: text
        description: "What did you do? (e.g., 'Moved Stop Loss')"
      - name: correction_logic
        type: text
        description: "The logic that counters the irrational thought"
      - name: created_at
        type: datetime
        default: "now()"

  DataSource:
    description: "Market Data Source Configuration"
    table_name: "data_sources"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: provider
        type: enum
        enum_values: ["OANDA", "BINANCE", "CTRADER"]
        required: true
        description: "Provider Implementation (e.g., OANDA, BINANCE)"
      - name: name
        type: string
        required: true
        unique: true
        description: "User-defined alias"
      - name: type
        type: enum
        enum_values: ["api", "csv", "db", "websocket"]
        required: true
        description: "Type of data source"
      - name: config_json
        type: jsonb
        required: true
        description: >-
          Encrypted connection details (API keys, URLs).
          Uses institutional Fernet encryption (Base64).
          Internal keys: OANDA {token, account_id}, CTRADER {token, client_id, client_secret, refresh_token, ...}
      - name: schema_json
        type: jsonb
        nullable: true
        description: "Expected data schema (e.g., column names for CSV, API response structure)"
      - name: is_active
        type: boolean
        default: true

  Candle:
    description: "OHLCV candlestick data with multi-timeframe indicators"
    table_name: "candles"
    indexes:
      - fields: ["symbol", "timeframe", "timestamp"]
        unique: true
      - fields: ["timestamp"]
    fields:
      - name: id
        type: uuid
        primary_key: true
        description: "Unique identifier for the candle"
      - name: market_symbol_id
        type: uuid
        foreign_key: "market_symbols.id"
        required: true
        description: "Link to the MarketSymbol"
      - name: timeframe
        type: string
        required: true
        max_length: 10
        description: "Timeframe identifier (15m, 1h, 4h, D)"
      - name: timestamp
        type: datetime
        required: true
        description: "Candle open timestamp (UTC)"
      - name: open
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Opening price"
      - name: high
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Highest price"
      - name: low
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Lowest price"
      - name: close
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Closing price"
      - name: volume
        type: decimal
        precision: 24
        scale: 8
        required: true
        description: "Trading volume"
      - name: is_complete
        type: boolean
        default: true
        description: "Whether the candle is closed/complete"
      # MTF Indicators (Computed, Non-Look-Ahead)
      - name: delta
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "Net Buy Volume - Net Sell Volume"
      - name: footprint
        type: jsonb
        nullable: true
        description: "Intra-candle volume data (Price Ladder with Bid/Ask volume)"
      - name: ema_9_4h
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "EMA(9) on 4H timeframe (for 15m candles, aligned)"
      - name: ema_200_4h
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "EMA(200) on 4H timeframe (macro bias filter)"
      - name: ema_200_d
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "EMA(200) on Daily timeframe (macro bias filter)"
      - name: atr_14_15m
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "ATR(14) on 15m timeframe (for stop loss calculation)"
      - name: body_to_wick_ratio
        type: decimal
        precision: 5
        scale: 4
        nullable: true
        description: "Body-to-Wick Ratio (Rv) for vector candle confirmation"
      - name: indicators
        type: jsonb
        nullable: true
        description: "Flexible storage for calculated indicators"
      - name: ai_labels
        type: jsonb
        nullable: true
        description: "Automated labels (e.g., fake_sweep, expansion_confirmed)"
      - name: regime_tag
        type: string
        nullable: true
        max_length: 50
        description: "Market regime classification (e.g., expansion, markdown)"
      - name: created_at
        type: datetime
        default: "now()"
        description: "Record creation timestamp"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"
        description: "Record last update timestamp"

  BrokerAccount:
    description: "User-specific broker account credentials and configuration"
    table_name: "broker_accounts"
    indexes:
      - fields: ["fund_id"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        required: true
        description: "The Fund that owns this account"
      - name: data_source_id
        type: uuid
        foreign_key: "data_sources.id"
        nullable: true
        description: "Direct link to the primary market data source for this account"
      - name: broker_name
        type: string
        required: true
      - name: account_name
        type: string
        required: true
      - name: account_number
        type: string
        nullable: true

  AccountHistory:
    description: "Time-series snapshots of broker account metrics"
    table_name: "account_history"
    indexes:
      - fields: ["broker_account_id", "timestamp"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: broker_account_id
        type: uuid
        foreign_key: "broker_accounts.id"
        required: true
      - name: balance
        type: decimal
        precision: 18
        scale: 2
        required: true
      - name: equity
        type: decimal
        precision: 18
        scale: 2
        required: true
      - name: used_margin
        type: decimal
        precision: 18
        scale: 2
        required: true
      - name: free_margin
        type: decimal
        precision: 18
        scale: 2
        required: true
      - name: margin_level
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Margin level percentage"
      - name: unrealized_gross
        type: decimal
        precision: 18
        scale: 2
        nullable: true
      - name: unrealized_net
        type: decimal
        precision: 18
        scale: 2
        nullable: true
      - name: timestamp
        type: datetime
        default: "now()"
        index: true
        required: true
        max_length: 50
        description: "Broker identifier (e.g., OANDA, BINANCE, CTRADER)"
      - name: account_name
        type: string
        required: true
        max_length: 100
        description: "User-defined alias"
      - name: account_number
        type: string
        max_length: 100
        nullable: true
        description: "Broker-assigned account ID"
      - name: credentials_encrypted
        type: jsonb
        required: true
        description: >-
          Encrypted API keys and secrets. 
          Standardized JSON structure (after decryption):
          - OANDA: {api_key, account_id}
          - BINANCE: {api_key, secret_key}
          - CTRADER / ICMARKETS / ICMARKETSSC: {client_id, client_secret, account_id, token, refresh_token, port, host}
      - name: is_active
        type: boolean
        default: true
      - name: is_live
        type: boolean
        default: false
        description: "True for Live environment, False for Demo/Practice"
      - name: created_at
        type: datetime
        default: "now()"
      - name: supported_symbols
        type: jsonb
        nullable: true
        description: "List of supported symbols for this account"
      - name: risk_settings
        type: jsonb
        nullable: true
        description: "Account-specific risk override (must be <= Fund limits)"
      - name: leverage
        type: integer
        nullable: true
        default: 30
        description: "Account leverage (e.g., 30 for 1:30, 1000 for 1:1000)"
      - name: currency
        type: string
        max_length: 10
        nullable: true
        default: "USD"
        description: "Account base currency (e.g., USD, JPY)"
      - name: balance_snapshot
        type: decimal
        precision: 18
        scale: 2
        nullable: true
        description: "Last known balance snapshot for risk calculations"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  Trade:
    description: "Individual trade records with risk and execution details"
    table_name: "trades"
    indexes:
      - fields: ["signal_timestamp"]
      - fields: ["status"]
      - fields: ["strategy_run_id"]
      - fields: ["broker_account_id"]
    fields:
      - name: trade_id
        type: uuid
        primary_key: true
        description: "Unique identifier for the trade"
      - name: strategy_run_id
        type: uuid
        nullable: true
        foreign_key: "strategy_runs.run_id"
        description: "Link to the strategy run that generated this trade"
      - name: broker_account_id
        type: uuid
        nullable: true
        foreign_key: "broker_accounts.id"
        description: "Link to the broker account where this trade was executed"
      - name: broker_trade_id
        type: string
        max_length: 100
        nullable: true
        description: "Official execution ID from the broker (OANDA tradeID, cTrader positionId)"
      - name: broker_deal_id
        type: string
        max_length: 100
        nullable: true
        description: "Stable deal identifier for cTrader deduplication; optional for OANDA"
      - name: symbol
        type: string
        required: true
        max_length: 20
        description: "Trading pair symbol (e.g., XAU/USD)"
      - name: strategy_name
        type: string
        required: true
        max_length: 100
        description: "Name of the strategy that generated the signal"
      - name: signal_timestamp
        type: datetime
        required: true
        description: "Timestamp when the signal was generated"
      - name: signal_timestamp_ns
        type: bigint
        nullable: true
        description: "Nanosecond precision timestamp for latency tracking"
      - name: latency_ms
        type: decimal
        precision: 10
        scale: 4
        nullable: true
        description: "Execution latency in milliseconds (Fill - Signal)"
      - name: is_shadow
        type: boolean
        default: false
        description: "True if this was a shadow/simulated trade"
      - name: parent_trade_id
        type: uuid
        nullable: true
        description: "Link to the parent trade for sliced orders (TWAP/VWAP)"
      - name: execution_algo
        type: string
        nullable: true
        description: "Execution algorithm used (TWAP, VWAP, SCALE_IN)"
      - name: algo_params
        type: jsonb
        nullable: true
        description: "Parameters for the execution algorithm (e.g., duration, slices)"
      - name: algo_status
        type: string
        default: "NONE"
        description: "Status of the execution algorithm (PENDING, RUNNING, COMPLETED, CANCELLED)"
      - name: signal_id
        type: uuid
        nullable: true
        description: "Link to the specific signal that triggered this trade"
      - name: status
        type: enum
        enum_values: ["OPEN", "CLOSED", "REJECTED"]
        required: true
        description: "Trade execution status (REJECTED tracks risk violations)"
      - name: rejection_reason
        type: string
        max_length: 500
        nullable: true
        description: "Reason for trade rejection (e.g., 'Risk exceeds $10 cap')"
      - name: direction
        type: enum
        enum_values: ["LONG", "SHORT"]
        required: true
        description: "Trade direction"
      - name: entry_price
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Planned or actual entry price"
      - name: sl_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "Stop loss price"
      - name: tp_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "Take profit price"
      - name: trailing_stop
        type: boolean
        default: false
        description: "Whether trailing stop is enabled for this trade"
      - name: lot_size
        type: decimal
        precision: 10
        scale: 2
        required: true
        description: "Calculated lot size (e.g. 0.01). Broker units must be divided by 100,000.0 for consistent persistence (100,000 units = 1.0 lot)."
      - name: risk_usd
        type: decimal
        precision: 10
        scale: 2
        required: true
        description: "Calculated risk in USD (must be <= $10)"
      - name: atr_pips
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "ATR-based stop loss distance in pips"
      - name: rr_ratio
        type: decimal
        precision: 5
        scale: 2
        nullable: true
        description: "Risk-to-reward ratio (minimum 1:2)"
      - name: pnl_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Realized profit/loss in USD (for closed trades)"
      - name: mae_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Maximum Adverse Excursion in USD"
      - name: mfe_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Maximum Favorable Excursion in USD"
      - name: exit_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "Actual exit price (for closed trades)"
      - name: exit_timestamp
        type: datetime
        nullable: true
        description: "Timestamp when the trade was closed"
      - name: commission
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Trading commission in USD"
      - name: metadata_json
        type: jsonb
        nullable: true
        description: "Additional trade metadata (confluence zones, indicators, etc.)"
      - name: knowledge_context
        type: jsonb
        nullable: true
        description: "Semantic summary from Knowledge Graph (FalkorDB) at time of trade"
      - name: created_at
        type: datetime
        default: "now()"
        description: "Record creation timestamp"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"
        description: "Record last update timestamp"

  StrategyRun:
    description: "Backtest run results and performance metrics"
    table_name: "strategy_runs"
    indexes:
      - fields: ["start_date", "end_date"]
      - fields: ["created_at"]
    fields:
      - name: run_id
        type: uuid
        primary_key: true
        description: "Unique identifier for the strategy run"
      - name: strategy_name
        type: string
        required: true
        max_length: 100
        description: "Name of the strategy being tested"
      - name: start_date
        type: date
        required: true
        description: "Backtest start date"
      - name: end_date
        type: date
        required: true
        description: "Backtest end date"
      - name: parameters_json
        type: jsonb
        required: true
        description: "Strategy parameters (EMA periods, ATR multiplier, Rv threshold, etc.)"
      # Performance Metrics (G2 Success Criteria)
      - name: sharpe_ratio
        type: decimal
        precision: 10
        scale: 4
        nullable: true
        description: "Sharpe Ratio (target > 0.8)"
      - name: sortino_ratio
        type: decimal
        precision: 10
        scale: 4
        nullable: true
        description: "Sortino Ratio (penalizes downside risk only)"
      - name: alpha
        type: decimal
        precision: 10
        scale: 4
        nullable: true
        description: "Alpha vs Benchmark (Excess return)"
      - name: beta
        type: decimal
        precision: 10
        scale: 4
        nullable: true
        description: "Beta vs Benchmark (Market sensitivity)"
      - name: information_ratio
        type: decimal
        precision: 10
        scale: 4
        nullable: true
        description: "Information Ratio (Active return / Tracking error)"
      - name: benchmark_symbol
        type: string
        max_length: 20
        nullable: true
        description: "Benchmark used for Alpha/Beta (e.g., XAU/USD)"
      - name: max_drawdown
        type: decimal
        precision: 10
        scale: 4
        nullable: true
        description: "Maximum Drawdown percentage (target < 15%)"
      - name: win_rate
        type: decimal
        precision: 5
        scale: 4
        nullable: true
        description: "Win rate (winning trades / total trades)"
      - name: total_trades
        type: integer
        nullable: true
        description: "Total number of trades executed"
      - name: winning_trades
        type: integer
        nullable: true
        description: "Number of winning trades"
      - name: losing_trades
        type: integer
        nullable: true
        description: "Number of losing trades"
      - name: total_pnl_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Total profit/loss in USD"
      - name: avg_win_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Average winning trade amount"
      - name: avg_loss_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Average losing trade amount"
      - name: max_consecutive_wins
        type: integer
        nullable: true
        description: "Maximum consecutive winning trades"
      - name: max_consecutive_losses
        type: integer
        nullable: true
        description: "Maximum consecutive losing trades"
      - name: status
        type: enum
        enum_values: ["RUNNING", "COMPLETED", "FAILED"]
        default: "RUNNING"
        description: "Run execution status"
      - name: error_message
        type: text
        nullable: true
        description: "Error message if run failed"
      - name: created_at
        type: datetime
        default: "now()"
        description: "Run start timestamp"
      - name: completed_at
        type: datetime
        nullable: true
        description: "Run completion timestamp"

  RiskRule:
    description: "Configurable risk guardrail thresholds (F2.2, F2.3, F2.4)"
    table_name: "risk_rules"
    fields:
      - name: rule_id
        type: uuid
        primary_key: true
        description: "Unique identifier for the risk rule"
      - name: rule_name
        type: string
        required: true
        unique: true
        max_length: 100
        description: "Name of the risk rule (e.g., 'MAX_RISK_PER_TRADE')"
      - name: rule_type
        type: enum
        enum_values: ["RISK_CAP", "LOT_SIZE", "VOLATILITY", "RR_RATIO"]
        required: true
        description: "Category of risk rule"
      - name: threshold_value
        type: decimal
        precision: 10
        scale: 2
        required: true
        description: "Threshold value (e.g., 10.00 for $10 risk cap)"
      - name: threshold_unit
        type: string
        max_length: 20
        required: true
        description: "Unit of measurement (USD, LOT, PIPS, RATIO)"
      - name: is_active
        type: boolean
        default: true
        description: "Whether this rule is currently enforced"
      - name: description
        type: text
        nullable: true
        description: "Human-readable description of the rule"
      - name: created_at
        type: datetime
        default: "now()"
        description: "Rule creation timestamp"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"
        description: "Rule last update timestamp"

  JournalEntry:
    description: "Trading Journal Entry - 'Psychological MRI' for performance analysis"
    table_name: "journal_entries"
    indexes:
      - fields: ["user_id", "created_at"]
      - fields: ["game_level"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: symbol
        type: string
        required: true
        max_length: 20
        description: "Trading pair (e.g., XAU/USD)"
      - name: direction
        type: enum
        enum_values: ["LONG", "SHORT"]
        required: true
      - name: entry_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
      - name: exit_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
      - name: pnl_amount
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Realized P&L in USD"
      - name: pnl_r
        type: decimal
        precision: 5
        scale: 2
        nullable: true
        description: "R-Multiple"
      - name: risk_amount
        type: decimal
        precision: 10
        scale: 2
        nullable: true
      - name: stop_loss_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
      - name: take_profit_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
      - name: session
        type: string
        max_length: 20
        nullable: true
        description: "Trading session (Asian, London, NY)"
      - name: context_score
        type: integer
        nullable: true
        description: "Self-rated market understanding (1-10)"
      - name: game_level
        type: enum
        enum_values: ["A_GAME", "B_GAME", "C_GAME"]
        nullable: true
        description: "Performance quality categorization"
      - name: trade_id
        type: uuid
        foreign_key: "trades.trade_id"
        nullable: true
        description: "Direct link to the executed trade for AI Episodic Memory"
      - name: is_ai_generated
        type: boolean
        default: false
        description: "True if this journal was automatically generated by the node_learn_from_outcomes AI agent"
      - name: ai_insight
        type: text
        nullable: true
        description: "The specific actionable rule or lesson extracted by the AI"
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  SentimentScore:
    description: "Market sentiment analysis results (The Sentiment)"
    table_name: "sentiment_scores"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: symbol
        type: string
        max_length: 20
        required: true
      - name: score
        type: decimal
        precision: 5
        scale: 4
        required: true
        description: "Sentiment score (-1.0 to 1.0)"
      - name: reason
        type: text
        nullable: true
      - name: source_breakdown
        type: jsonb
        nullable: true
        description: "Sentiment source contributions"
      - name: created_at
        type: datetime
        default: "now()"

  MentalState:
    description: "Emotional severity levels for journal entry"
    table_name: "mental_states"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: journal_entry_id
        type: uuid
        foreign_key: "journal_entries.id"
        required: true
      - name: greed_level
        type: integer
        default: 0
        description: "Greed severity (0-10)"
      - name: fear_level
        type: integer
        default: 0
        description: "Fear severity (0-10)"
      - name: tilt_level
        type: integer
        default: 0
        description: "Tilt/Anger severity (0-10)"
      - name: confidence_level
        type: integer
        default: 0
        description: "Confidence level (0-10, 5=ideal)"
      - name: discipline_level
        type: integer
        default: 0
        description: "Discipline level (0-10)"

  TimelineEvent:
    description: "Mental pattern timeline sequence"
    table_name: "timeline_events"
    indexes:
      - fields: ["journal_entry_id", "order_index"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: journal_entry_id
        type: uuid
        foreign_key: "journal_entries.id"
        required: true
      - name: type
        type: string
        required: true
        max_length: 20
        description: "Event type (TRIGGER, THOUGHT, EMOTION, BEHAVIOR)"
      - name: description
        type: text
        required: true
      - name: timestamp
        type: datetime
        default: "now()"
      - name: order_index
        type: integer
        required: true
        description: "Sequence order in timeline"

  RootCauseAnalysis:
    description: "5-field structured root cause analysis"
    table_name: "root_cause_analyses"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: journal_entry_id
        type: uuid
        foreign_key: "journal_entries.id"
        required: true
      - name: problem
        type: text
        nullable: true
        description: "What's the problem?"
      - name: why_exist
        type: text
        nullable: true
        description: "Why does the problem exist?"
      - name: flaw
        type: text
        nullable: true
        description: "What is flawed?"
      - name: correction
        type: text
        nullable: true
        description: "What's the correction?"
      - name: logic
        type: text
        nullable: true
        description: "What logic confirms the correction?"

  Transaction:
    description: "Financial transactions (Deposits/Withdrawals) for funds"
    table_name: "transactions"
    indexes:
      - fields: ["fund_id", "transaction_date"]
      - fields: ["type"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        required: true
      - name: transaction_date
        type: datetime
        required: true
      - name: type
        type: enum
        enum_values: ["DEPOSIT", "WITHDRAWAL"]
        required: true
      - name: amount
        type: decimal
        precision: 18
        scale: 8
        required: true
      - name: currency
        type: string
        max_length: 10
        default: "USD"
        required: true
      - name: status
        type: string
        max_length: 50
        default: "COMPLETED"
        description: "Transaction status (e.g., Approved, Declined)"
      - name: reference
        type: string
        max_length: 100
        nullable: true
        description: "External reference ID"
      - name: description
        type: text
        nullable: true
      - name: payment_method
        type: string
        max_length: 50
        nullable: true
      - name: trading_account
        type: string
        max_length: 50
        nullable: true
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  SavedStrategy:
    description: "User-defined strategy library for storage and sharing"
    table_name: "saved_strategies"
    indexes:
      - fields: ["user_id"]
      - fields: ["is_public"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: name
        type: string
        required: true
        max_length: 100
      - name: description
        type: text
        nullable: true
      - name: code
        type: text
        required: true
      - name: parameters
        type: jsonb
        default: "{}"
      - name: last_results
        type: jsonb
        nullable: true
      - name: last_optimization_result
        type: jsonb
        nullable: true
      - name: last_simulation_result
        type: jsonb
        nullable: true
      - name: is_public
        type: boolean
        default: false
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

relationships:
  - from: Trade
    to: StrategyRun
    type: many_to_one
    foreign_key: strategy_run_id
    description: "Each trade belongs to a strategy run (or null for manual trades)"

validation_rules:
  Trade:
    - field: risk_usd
      rule: "risk_usd <= 10.00"
      error: "Risk per trade must not exceed $10 (F2.2)"
    - field: lot_size
      rule: "lot_size >= 0.01"
      error: "Lot size must be at least 0.01 (F2.3)"
    - field: atr_pips
      rule: "atr_pips <= 100.0 OR atr_pips IS NULL"
      error: "ATR-based stop loss must not exceed 100 pips (F2.4)"
    - field: rr_ratio
      rule: "rr_ratio >= 2.0 OR rr_ratio IS NULL"
      error: "Risk-to-reward ratio must be at least 1:2"

  StrategyRun:
    - field: end_date
      rule: "end_date >= start_date"
      error: "End date must be after or equal to start date"

  UserPreferences:
    description: "User-specific preferences for trading and portfolio management"
    table_name: "user_preferences"
    indexes:
      - fields: ["user_id"]
        unique: true
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: default_fund_id
        type: uuid
        foreign_key: "funds.id"
        nullable: true
      - name: preferred_timeframes
        type: jsonb
        default: '["4H", "1H", "15m"]'
        required: true
      - name: default_symbol
        type: string
        max_length: 20
        default: "XAU/USD"
        required: true
      - name: session_preferences
        type: jsonb
        nullable: true
      - name: oanda_janitor_enabled
        type: boolean
        default: false
        description: "If true, allows the system to automatically reconcile and sync OANDA positions"
      - name: ctrader_janitor_enabled
        type: boolean
        default: false
        description: "If true, allows the system to automatically reconcile and sync cTrader positions"
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  BacktestConfig:
    description: "Saved backtest configurations"
    table_name: "backtest_configs"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        nullable: true
      - name: name
        type: string
        max_length: 100
        required: true
      - name: description
        type: string
        max_length: 255
        nullable: true
      - name: config_json
        type: jsonb
        required: true
        description: "Payload: symbol, timeframe, dates, strategy_params"
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  BacktestHistory:
    description: "History of executed backtest runs"
    table_name: "backtest_history"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: config_id
        type: uuid
        foreign_key: "backtest_configs.id"
        nullable: true
      - name: strategy_id
        type: uuid
        nullable: true
      - name: execution_config
        type: jsonb
        required: true
        description: "Snapshot of config used for this run"
      - name: status
        type: string
        max_length: 20
        default: "COMPLETED"
      - name: metrics
        type: jsonb
        nullable: true
      - name: best_params
        type: jsonb
        nullable: true
      - name: created_at
        type: datetime
        default: "now()"

        nullable: true
        description: "Persisted backtest metrics and plot"
      - name: last_optimization_result
        type: jsonb
        nullable: true
      - name: last_simulation_result
        type: jsonb
        nullable: true
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  Deployment:
    description: "Live or Paper trading instances of strategies"
    table_name: "deployments"
    indexes:
      - fields: ["user_id"]
      - fields: ["strategy_id"]
      - fields: ["status"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        required: true
        description: "The Fund this deployment belongs to"
      - name: strategy_id
        type: uuid
        foreign_key: "saved_strategies.id"
        required: true
      - name: stock_symbol
        type: string
        required: true
        max_length: 20
      - name: timeframe
        type: string
        required: true
        max_length: 10
      - name: status
        type: enum
        enum_values: ["STARTING", "ACTIVE", "STOPPED", "ERROR", "STOPPING"]
        default: "STARTING"
        required: true
      - name: is_live
        type: boolean
        default: false
        description: "True for Live Trading, False for Paper Trading"
      - name: config_snapshot
        type: jsonb
        required: true
        description: "Snapshot of strategy parameters at deployment time"
      - name: last_error
        type: text
        nullable: true
      - name: started_at
        type: datetime
        default: "now()"
      - name: stopped_at
        type: datetime
        nullable: true
      - name: last_signal_at
        type: datetime
        nullable: true

  ChatSession:
    description: "AI Chat sessions linked to strategies"
    table_name: "chat_sessions"
    indexes:
      - fields: ["user_id"]
      - fields: ["strategy_id"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: strategy_id
        type: uuid
        foreign_key: "saved_strategies.id"
        nullable: true
        description: "Optional link to a specific strategy context"
      - name: title
        type: string
        max_length: 200
        nullable: true
        description: "Auto-generated or user-defined title"
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  ChatMessage:
    description: "Individual messages within a chat session"
    table_name: "chat_messages"
    indexes:
      - fields: ["session_id", "created_at"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: session_id
        type: uuid
        foreign_key: "chat_sessions.id"
        required: true
      - name: role
        type: enum
        enum_values: ["user", "assistant", "system"]
        required: true
      - name: content
        type: text
        required: true
      - name: context_snapshot
        type: jsonb
        nullable: true
        description: "Snapshot of relevant context (code, metrics) at message time"
      - name: created_at
        type: datetime
        default: "now()"
  SignalLog:
    description: "Persisted log of signals detected by strategies (both scanner and custom deployments)"
    table_name: "signal_logs"
    indexes:
      - fields: ["timestamp"]
      - fields: ["symbol"]
      - fields: ["deployment_id"]
      - fields: ["timestamp", "user_id", "status"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: timestamp
        type: datetime
        default: "now()"
        required: true
        description: "Time signal was detected"
      - name: symbol
        type: string
        required: true
        max_length: 20
      - name: timeframe
        type: string
        default: "H1"
        max_length: 10
      - name: direction
        type: string
        required: true
        description: "BULLISH, BEARISH, NEUTRAL"
      - name: strategy_name
        type: string
        nullable: true
        max_length: 100
      - name: deployment_id
        type: uuid
        foreign_key: "deployments.id"
        nullable: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        nullable: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        nullable: true
      - name: broker_account_id
        type: uuid
        foreign_key: "broker_accounts.id"
        nullable: true
      - name: confidence
        type: decimal
        precision: 5
        scale: 4
        default: 0.0
      - name: price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "Price at detection"
      - name: reason
        type: text
        nullable: true
      - name: meta_data
        type: jsonb
        nullable: true
      - name: sentiment_score
        type: decimal
        precision: 3
        scale: 2
        nullable: true
        description: "News sentiment score (-1.0 to 1.0) at time of signal"
      - name: sentiment_reason
        type: text
        nullable: true
        description: "Explanation of the sentiment score"
      - name: filled_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
      - name: filled_time
        type: datetime
        nullable: true
      - name: commission
        type: decimal
        precision: 18
        scale: 8
        nullable: true
      - name: knowledge_context
        type: jsonb
        nullable: true
        description: "Semantic summary from Knowledge Graph (FalkorDB) at time of signal"
      - name: knowledge_score
        type: decimal
        precision: 5
        scale: 4
        nullable: true
        description: "Semantic multiplier (0.5x to 1.5x) based on Knowledge context"
      - name: status
        type: enum
        enum_values: ["CREATED", "PENDING_APPROVAL", "EXECUTED", "FILLED", "REJECTED", "EXPIRED", "FAILED"]
        default: "CREATED"
        required: true
      - name: execution_id
        type: uuid
        nullable: true
        description: "ID of the executed trade (link to trades.trade_id)"

  Plugin:
    description: "Registry of available system plugins"
    table_name: "plugins"
    fields:
      - name: id
        type: string
        primary_key: true
        max_length: 100
        description: "Unique plugin identifier (e.g., 'olympus-lstm-predictor')"
      - name: name
        type: string
        required: true
        max_length: 255
      - name: description
        type: text
        nullable: true
      - name: author
        type: string
        max_length: 100
        nullable: true
      - name: version
        type: string
