# MTF Trading System - Data Model Specification (v1.0)
# Last Validated: 2025-12-18 (Matches Codebase)
# This is the source of truth for all database entities and their relationships
# All Pydantic models and Alembic migrations must align with this specification

entities:
  User:
    description: "System users (Traders, Admins, etc.)"
    table_name: "users"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: username
        type: string
        required: true
        unique: true
        max_length: 50
      - name: email
        type: string
        required: true
        unique: true
        max_length: 100
      - name: password_hash
        type: string
        required: true
      - name: is_active
        type: boolean
        default: true
      - name: is_superuser
        type: boolean
        default: false
      - name: created_at
        type: datetime
        default: "now()"
      - name: avatar_url
        type: string
        nullable: true
        description: "URL to user profile picture"

  Fund:
    description: "Quant Fund or Trading Group"
    table_name: "funds"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: name
        type: string
        required: true
        max_length: 100
      - name: description
        type: text
        nullable: true
      - name: created_at
        type: datetime
        default: "now()"

  UserFund:
    description: "Many-to-Many relationship between Users and Funds with Roles"
    table_name: "user_funds"
    indexes:
      - fields: ["user_id", "fund_id"]
        unique: true
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        required: true
      - name: role
        type: enum
        enum_values: ["OWNER", "MANAGER", "TRADER", "VIEWER"]
        required: true

  Strategy:
    description: "Active Strategy Instance (Fleet Member)"
    table_name: "strategies"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        required: true
      - name: name
        type: string
        required: true
        max_length: 100
      - name: template_id
        type: string
        required: true
        description: "Identifier for the strategy logic template (e.g., 'SMC_V1')"
      - name: broker_account_id
        type: uuid
        foreign_key: "broker_accounts.id"
        required: true
        description: "The portfolio/account where trades will be executed"
      - name: config_json
        type: jsonb
        required: true
        description: "Strategy-specific configuration parameters (overrides template defaults)"
      - name: risk_settings
        type: jsonb
        required: true
        default: "{}"
        description: "Instance-specific risk configuration (e.g., max_risk_usd)"
      - name: is_active
        type: boolean
        default: false
      - name: created_at
        type: datetime
        default: "now()"

  DataSource:
    description: "Market Data Source Configuration"
    table_name: "data_sources"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: name
        type: string
        required: true
        unique: true
        description: "Provider name (e.g., OANDA, BINANCE)"
      - name: type
        type: string
        required: true
        max_length: 50
        description: "Type of data source (e.g., api, csv, db)"
      - name: config_json
        type: jsonb
        required: true
        description: "Connection details (API keys, URLs) - Encrypted in app"
      - name: schema_json
        type: jsonb
        nullable: true
        description: "Expected data schema (e.g., column names for CSV, API response structure)"
      - name: is_active
        type: boolean
        default: true

  Candle:
    description: "OHLCV candlestick data with multi-timeframe indicators"
    table_name: "candles"
    indexes:
      - fields: ["symbol", "timeframe", "timestamp"]
        unique: true
      - fields: ["timestamp"]
    fields:
      - name: id
        type: uuid
        primary_key: true
        description: "Unique identifier for the candle"
      - name: symbol
        type: string
        required: true
        max_length: 20
        description: "Trading pair symbol (e.g., XAU/USD)"
      - name: timeframe
        type: string
        required: true
        max_length: 10
        description: "Timeframe identifier (15m, 1h, 4h, D)"
      - name: timestamp
        type: datetime
        required: true
        description: "Candle open timestamp (UTC)"
      - name: open
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Opening price"
      - name: high
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Highest price"
      - name: low
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Lowest price"
      - name: close
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Closing price"
      - name: volume
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Trading volume"
      - name: is_complete
        type: boolean
        default: true
        description: "Whether the candle is closed/complete"
      # MTF Indicators (Computed, Non-Look-Ahead)
      - name: ema_9_4h
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "EMA(9) on 4H timeframe (for 15m candles, aligned)"
      - name: ema_200_4h
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "EMA(200) on 4H timeframe (macro bias filter)"
      - name: ema_200_d
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "EMA(200) on Daily timeframe (macro bias filter)"
      - name: atr_14_15m
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "ATR(14) on 15m timeframe (for stop loss calculation)"
      - name: body_to_wick_ratio
        type: decimal
        precision: 5
        scale: 4
        nullable: true
        description: "Body-to-Wick Ratio (Rv) for vector candle confirmation"
      - name: created_at
        type: datetime
        default: "now()"
        description: "Record creation timestamp"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"
        description: "Record last update timestamp"

  BrokerAccount:
    description: "User-specific broker account credentials and configuration"
    table_name: "broker_accounts"
    indexes:
      - fields: ["user_id"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: broker_name
        type: string
        required: true
        max_length: 50
        description: "Broker identifier (e.g., OANDA, BINANCE)"
      - name: account_name
        type: string
        required: true
        max_length: 100
        description: "User-defined alias"
      - name: account_number
        type: string
        max_length: 100
        nullable: true
        description: "Broker-assigned account ID"
      - name: credentials_encrypted
        type: jsonb
        required: true
        description: "Encrypted API keys and secrets"
      - name: is_active
        type: boolean
        default: true
      - name: is_live
        type: boolean
        default: false
        description: "True for Live environment, False for Demo/Practice"
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  Trade:
    description: "Individual trade records with risk and execution details"
    table_name: "trades"
    indexes:
      - fields: ["signal_timestamp"]
      - fields: ["status"]
      - fields: ["strategy_run_id"]
      - fields: ["broker_account_id"]
    fields:
      - name: trade_id
        type: uuid
        primary_key: true
        description: "Unique identifier for the trade"
      - name: strategy_run_id
        type: uuid
        nullable: true
        foreign_key: "strategy_runs.run_id"
        description: "Link to the strategy run that generated this trade"
      - name: broker_account_id
        type: uuid
        nullable: true
        foreign_key: "broker_accounts.id"
        description: "Link to the broker account where this trade was executed"
      - name: symbol
        type: string
        required: true
        max_length: 20
        description: "Trading pair symbol (e.g., XAU/USD)"
      - name: strategy_name
        type: string
        required: true
        max_length: 100
        description: "Name of the strategy that generated the signal"
      - name: signal_timestamp
        type: datetime
        required: true
        description: "Timestamp when the signal was generated"
      - name: status
        type: enum
        enum_values: ["OPEN", "CLOSED", "REJECTED"]
        required: true
        description: "Trade execution status (REJECTED tracks risk violations)"
      - name: rejection_reason
        type: string
        max_length: 500
        nullable: true
        description: "Reason for trade rejection (e.g., 'Risk exceeds $10 cap')"
      - name: direction
        type: enum
        enum_values: ["LONG", "SHORT"]
        required: true
        description: "Trade direction"
      - name: entry_price
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Planned or actual entry price"
      - name: sl_price
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Stop loss price"
      - name: tp_price
        type: decimal
        precision: 18
        scale: 8
        required: true
        description: "Take profit price"
      - name: lot_size
        type: decimal
        precision: 10
        scale: 2
        required: true
        description: "Calculated lot size (must be >= 0.01)"
      - name: risk_usd
        type: decimal
        precision: 10
        scale: 2
        required: true
        description: "Calculated risk in USD (must be <= $10)"
      - name: atr_pips
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "ATR-based stop loss distance in pips"
      - name: rr_ratio
        type: decimal
        precision: 5
        scale: 2
        nullable: true
        description: "Risk-to-reward ratio (minimum 1:2)"
      - name: pnl_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Realized profit/loss in USD (for closed trades)"
      - name: mae_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Maximum Adverse Excursion in USD"
      - name: mfe_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Maximum Favorable Excursion in USD"
      - name: exit_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
        description: "Actual exit price (for closed trades)"
      - name: exit_timestamp
        type: datetime
        nullable: true
        description: "Timestamp when the trade was closed"
      - name: metadata_json
        type: jsonb
        nullable: true
        description: "Additional trade metadata (confluence zones, indicators, etc.)"
      - name: created_at
        type: datetime
        default: "now()"
        description: "Record creation timestamp"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"
        description: "Record last update timestamp"

  StrategyRun:
    description: "Backtest run results and performance metrics"
    table_name: "strategy_runs"
    indexes:
      - fields: ["start_date", "end_date"]
      - fields: ["created_at"]
    fields:
      - name: run_id
        type: uuid
        primary_key: true
        description: "Unique identifier for the strategy run"
      - name: strategy_name
        type: string
        required: true
        max_length: 100
        description: "Name of the strategy being tested"
      - name: start_date
        type: date
        required: true
        description: "Backtest start date"
      - name: end_date
        type: date
        required: true
        description: "Backtest end date"
      - name: parameters_json
        type: jsonb
        required: true
        description: "Strategy parameters (EMA periods, ATR multiplier, Rv threshold, etc.)"
      # Performance Metrics (G2 Success Criteria)
      - name: sharpe_ratio
        type: decimal
        precision: 10
        scale: 4
        nullable: true
        description: "Sharpe Ratio (target > 0.8)"
      - name: max_drawdown
        type: decimal
        precision: 10
        scale: 4
        nullable: true
        description: "Maximum Drawdown percentage (target < 15%)"
      - name: win_rate
        type: decimal
        precision: 5
        scale: 4
        nullable: true
        description: "Win rate (winning trades / total trades)"
      - name: total_trades
        type: integer
        nullable: true
        description: "Total number of trades executed"
      - name: winning_trades
        type: integer
        nullable: true
        description: "Number of winning trades"
      - name: losing_trades
        type: integer
        nullable: true
        description: "Number of losing trades"
      - name: total_pnl_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Total profit/loss in USD"
      - name: avg_win_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Average winning trade amount"
      - name: avg_loss_usd
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Average losing trade amount"
      - name: max_consecutive_wins
        type: integer
        nullable: true
        description: "Maximum consecutive winning trades"
      - name: max_consecutive_losses
        type: integer
        nullable: true
        description: "Maximum consecutive losing trades"
      - name: status
        type: enum
        enum_values: ["RUNNING", "COMPLETED", "FAILED"]
        default: "RUNNING"
        description: "Run execution status"
      - name: error_message
        type: text
        nullable: true
        description: "Error message if run failed"
      - name: created_at
        type: datetime
        default: "now()"
        description: "Run start timestamp"
      - name: completed_at
        type: datetime
        nullable: true
        description: "Run completion timestamp"

  RiskRule:
    description: "Configurable risk guardrail thresholds (F2.2, F2.3, F2.4)"
    table_name: "risk_rules"
    fields:
      - name: rule_id
        type: uuid
        primary_key: true
        description: "Unique identifier for the risk rule"
      - name: rule_name
        type: string
        required: true
        unique: true
        max_length: 100
        description: "Name of the risk rule (e.g., 'MAX_RISK_PER_TRADE')"
      - name: rule_type
        type: enum
        enum_values: ["RISK_CAP", "LOT_SIZE", "VOLATILITY", "RR_RATIO"]
        required: true
        description: "Category of risk rule"
      - name: threshold_value
        type: decimal
        precision: 10
        scale: 2
        required: true
        description: "Threshold value (e.g., 10.00 for $10 risk cap)"
      - name: threshold_unit
        type: string
        max_length: 20
        required: true
        description: "Unit of measurement (USD, LOT, PIPS, RATIO)"
      - name: is_active
        type: boolean
        default: true
        description: "Whether this rule is currently enforced"
      - name: description
        type: text
        nullable: true
        description: "Human-readable description of the rule"
      - name: created_at
        type: datetime
        default: "now()"
        description: "Rule creation timestamp"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"
        description: "Rule last update timestamp"

  JournalEntry:
    description: "Trading Journal Entry - 'Psychological MRI' for performance analysis"
    table_name: "journal_entries"
    indexes:
      - fields: ["user_id", "created_at"]
      - fields: ["game_level"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: symbol
        type: string
        required: true
        max_length: 20
        description: "Trading pair (e.g., XAU/USD)"
      - name: direction
        type: enum
        enum_values: ["LONG", "SHORT"]
        required: true
      - name: entry_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
      - name: exit_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
      - name: pnl_amount
        type: decimal
        precision: 10
        scale: 2
        nullable: true
        description: "Realized P&L in USD"
      - name: pnl_r
        type: decimal
        precision: 5
        scale: 2
        nullable: true
        description: "R-Multiple"
      - name: risk_amount
        type: decimal
        precision: 10
        scale: 2
        nullable: true
      - name: stop_loss_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
      - name: take_profit_price
        type: decimal
        precision: 18
        scale: 8
        nullable: true
      - name: session
        type: string
        max_length: 20
        nullable: true
        description: "Trading session (Asian, London, NY)"
      - name: context_score
        type: integer
        nullable: true
        description: "Self-rated market understanding (1-10)"
      - name: game_level
        type: enum
        enum_values: ["A_GAME", "B_GAME", "C_GAME"]
        nullable: true
        description: "Performance quality categorization"
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  MentalState:
    description: "Emotional severity levels for journal entry"
    table_name: "mental_states"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: journal_entry_id
        type: uuid
        foreign_key: "journal_entries.id"
        required: true
      - name: greed_level
        type: integer
        default: 0
        description: "Greed severity (0-10)"
      - name: fear_level
        type: integer
        default: 0
        description: "Fear severity (0-10)"
      - name: tilt_level
        type: integer
        default: 0
        description: "Tilt/Anger severity (0-10)"
      - name: confidence_level
        type: integer
        default: 0
        description: "Confidence level (0-10, 5=ideal)"
      - name: discipline_level
        type: integer
        default: 0
        description: "Discipline level (0-10)"

  TimelineEvent:
    description: "Mental pattern timeline sequence"
    table_name: "timeline_events"
    indexes:
      - fields: ["journal_entry_id", "order_index"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: journal_entry_id
        type: uuid
        foreign_key: "journal_entries.id"
        required: true
      - name: type
        type: string
        required: true
        max_length: 20
        description: "Event type (TRIGGER, THOUGHT, EMOTION, BEHAVIOR)"
      - name: description
        type: text
        required: true
      - name: timestamp
        type: datetime
        default: "now()"
      - name: order_index
        type: integer
        required: true
        description: "Sequence order in timeline"

  RootCauseAnalysis:
    description: "5-field structured root cause analysis"
    table_name: "root_cause_analyses"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: journal_entry_id
        type: uuid
        foreign_key: "journal_entries.id"
        required: true
      - name: problem
        type: text
        nullable: true
        description: "What's the problem?"
      - name: why_exist
        type: text
        nullable: true
        description: "Why does the problem exist?"
      - name: flaw
        type: text
        nullable: true
        description: "What is flawed?"
      - name: correction
        type: text
        nullable: true
        description: "What's the correction?"
      - name: logic
        type: text
        nullable: true
        description: "What logic confirms the correction?"

  Transaction:
    description: "Financial transactions (Deposits/Withdrawals) for funds"
    table_name: "transactions"
    indexes:
      - fields: ["fund_id", "transaction_date"]
      - fields: ["type"]
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: fund_id
        type: uuid
        foreign_key: "funds.id"
        required: true
      - name: transaction_date
        type: datetime
        required: true
      - name: type
        type: enum
        enum_values: ["DEPOSIT", "WITHDRAWAL"]
        required: true
      - name: amount
        type: decimal
        precision: 18
        scale: 8
        required: true
      - name: currency
        type: string
        max_length: 10
        default: "USD"
        required: true
      - name: status
        type: string
        max_length: 50
        default: "COMPLETED"
        description: "Transaction status (e.g., Approved, Declined)"
      - name: reference
        type: string
        max_length: 100
        nullable: true
        description: "External reference ID"
      - name: description
        type: text
        nullable: true
      - name: payment_method
        type: string
        max_length: 50
        nullable: true
      - name: trading_account
        type: string
        max_length: 50
        nullable: true
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

relationships:
  - from: Trade
    to: StrategyRun
    type: many_to_one
    foreign_key: strategy_run_id
    description: "Each trade belongs to a strategy run (or null for manual trades)"

validation_rules:
  Trade:
    - field: risk_usd
      rule: "risk_usd <= 10.00"
      error: "Risk per trade must not exceed $10 (F2.2)"
    - field: lot_size
      rule: "lot_size >= 0.01"
      error: "Lot size must be at least 0.01 (F2.3)"
    - field: atr_pips
      rule: "atr_pips <= 100.0 OR atr_pips IS NULL"
      error: "ATR-based stop loss must not exceed 100 pips (F2.4)"
    - field: rr_ratio
      rule: "rr_ratio >= 2.0 OR rr_ratio IS NULL"
      error: "Risk-to-reward ratio must be at least 1:2"

  StrategyRun:
    - field: end_date
      rule: "end_date >= start_date"
      error: "End date must be after or equal to start date"

  UserPreferences:
    description: "User-specific preferences for trading and portfolio management"
    table_name: "user_preferences"
    indexes:
      - fields: ["user_id"]
        unique: true
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        foreign_key: "users.id"
        required: true
      - name: default_fund_id
        type: uuid
        foreign_key: "funds.id"
        nullable: true
      - name: strategy_type
        type: enum
        enum_values: ["MTF_SMC_BASIC", "LONG_SHORT_EQUITY", "MACRO_TACTICAL", "MULTI_ASSET"]
        default: "MTF_SMC_BASIC"
        required: true
      - name: asset_classes
        type: jsonb
        default: '["FX"]'
        required: true
      - name: max_risk_per_trade
        type: decimal
        precision: 10
        scale: 2
        default: 10.00
        required: true
      - name: default_lot_size
        type: decimal
        precision: 10
        scale: 2
        default: 0.01
        required: true
      - name: max_drawdown_threshold
        type: decimal
        precision: 10
        scale: 2
        nullable: true
      - name: max_portfolio_beta
        type: decimal
        precision: 5
        scale: 2
        default: 0.35
        nullable: true
      - name: gross_exposure_limit
        type: decimal
        precision: 5
        scale: 2
        default: 100.00
        nullable: true
      - name: net_exposure_limit
        type: decimal
        precision: 5
        scale: 2
        default: 15.00
        nullable: true
      - name: position_limit_single
        type: decimal
        precision: 5
        scale: 2
        default: 3.00
        nullable: true
      - name: position_limit_sector
        type: decimal
        precision: 5
        scale: 2
        default: 10.00
        nullable: true
      - name: preferred_timeframes
        type: jsonb
        default: '["4H", "1H", "15m"]'
        required: true
      - name: default_symbol
        type: string
        max_length: 20
        default: "XAU/USD"
        required: true
      - name: session_preferences
        type: jsonb
        nullable: true
      - name: supported_symbols
        type: jsonb
        nullable: true
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  BacktestConfig:
    description: "Saved backtest configurations"
    table_name: "backtest_configs"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: user_id
        type: uuid
        nullable: true
      - name: name
        type: string
        max_length: 100
        required: true
      - name: description
        type: string
        max_length: 255
        nullable: true
      - name: config_json
        type: jsonb
        required: true
        description: "Payload: symbol, timeframe, dates, strategy_params"
      - name: created_at
        type: datetime
        default: "now()"
      - name: updated_at
        type: datetime
        default: "now()"
        on_update: "now()"

  BacktestHistory:
    description: "History of executed backtest runs"
    table_name: "backtest_history"
    fields:
      - name: id
        type: uuid
        primary_key: true
      - name: config_id
        type: uuid
        foreign_key: "backtest_configs.id"
        nullable: true
      - name: strategy_id
        type: uuid
        nullable: true
      - name: execution_config
