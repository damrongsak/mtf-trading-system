### specs/02_api_spec.yaml (snippet)

openapi: 3.0.0
info:
  title: MTF Trading API
  version: 0.1.0
paths:
  /api/v1/signal/check:
    post:
      summary: Check if a signal is valid given current state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalRequest'
      responses:
        '200':
          description: signal check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
components:
  schemas:
    SignalRequest:
      type: object
      properties:
        symbol:
          type: string
        timeframe:
          type: string
    SignalResponse:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string

  /api/v1/risk/check:
    post:
      summary: Check if a trade execution is allowed based on risk rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskCheckRequest'
      responses:
        '200':
          description: Risk check decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskCheckResponse'

    RiskCheckRequest:
      type: object
      required:
        - risk_usd
        - sl_distance_usd
        - min_lot
      properties:
        risk_usd:
          type: number
          description: Maximum risk in USD allowed for this trade
        sl_distance_usd:
          type: number
          description: Distance to stop loss in USD (per unit/contract)
        min_lot:
          type: number
          description: Minimum allowed lot size (e.g., 0.01)

    RiskCheckResponse:
      type: object
      properties:
        can_execute:
          type: boolean
        lot:
          type: number
        reason:
          type: string
