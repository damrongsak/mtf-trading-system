### specs/02_api_spec.yaml (snippet)

openapi: 3.0.0
info:
  title: MTF Trading API
  version: 0.1.0
paths:
  /api/v1/signal/check:
    post:
      summary: Check if a signal is valid given current state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalRequest'
      responses:
        '200':
          description: signal check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
components:
  schemas:
    SignalRequest:
      type: object
      properties:
        symbol:
          type: string
        timeframe:
          type: string
    SignalResponse:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string

  /api/v1/risk/check:
    post:
      summary: Check if a trade execution is allowed based on risk rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskCheckRequest'
      responses:
        '200':
          description: Risk check decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskCheckResponse'

  /api/v1/auth/token:
    post:
      summary: Login to get access token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

  /api/v1/users/me:
    get:
      summary: Get current user details
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/funds:
    get:
      summary: List funds for current user
      responses:
        '200':
          description: List of funds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fund'
    post:
      summary: Create a new fund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundCreate'
      responses:
        '201':
          description: Fund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fund'

  /api/v1/strategies:
    get:
      summary: List strategies for a fund
      parameters:
        - name: fund_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Strategy'
    post:
      summary: Create a new strategy configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyCreate'
      responses:
        '201':
          description: Strategy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'

    RiskCheckRequest:
      type: object
      required:
        - risk_usd
        - sl_distance_usd
        - min_lot
      properties:
        risk_usd:
          type: number
          description: Maximum risk in USD allowed for this trade
        sl_distance_usd:
          type: number
          description: Distance to stop loss in USD (per unit/contract)
        min_lot:
          type: number
          description: Minimum allowed lot size (e.g., 0.01)

    RiskCheckResponse:
      type: object
      properties:
        can_execute:
          type: boolean
        lot:
          type: number
        reason:
          type: string

    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        is_active:
          type: boolean

    Fund:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    FundCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    Strategy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        config_json:
          type: object
        is_active:
          type: boolean

    StrategyCreate:
      type: object
      required:
        - name
        - fund_id
        - type
        - config_json
      properties:
        name:
          type: string
        fund_id:
          type: string
          format: uuid
        type:
          type: string
        config_json:
          type: object

  /api/v1/journal/:
    get:
      summary: List journal entries for current user
      responses:
        '200':
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEntryResponse'
    post:
      summary: Create a new journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryCreate'
      responses:
        '200':
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'

  /api/v1/journal/{entry_id}:
    get:
      summary: Get journal entry details
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Journal entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'

components:
  schemas:
    JournalEntryCreate:
      type: object
      required:
        - symbol
        - direction
      properties:
        symbol:
          type: string
        direction:
          type: string
          enum: [LONG, SHORT]
        session:
          type: string
        entry_price:
          type: number
        exit_price:
          type: number
        pnl_amount:
          type: number
        pnl_r:
          type: number
        risk_amount:
          type: number
        stop_loss_price:
          type: number
        take_profit_price:
          type: number
        context_score:
          type: integer
          minimum: 1
          maximum: 10
        game_level:
          type: string
          enum: [A_GAME, B_GAME, C_GAME]
        mental_state:
          type: object
          properties:
            greed_level:
              type: integer
            fear_level:
              type: integer
            tilt_level:
              type: integer
            confidence_level:
              type: integer
            discipline_level:
              type: integer
        timeline_events:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string
              order_index:
                type: integer
        root_cause:
          type: object
          properties:
            problem:
              type: string
            why_exist:
              type: string
            flaw:
              type: string
            correction:
              type: string
            logic:
              type: string

    JournalEntryResponse:
      allOf:
        - $ref: '#/components/schemas/JournalEntryCreate'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
