openapi: 3.0.0
info:
  title: MTF Trading API
  version: 0.1.0
paths:
  /api/v1/signal/latest/{symbol}:
    get:
      summary: Get the latest signal for a specific symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SignalResponse'
  /api/v1/signal/check:
    post:
      summary: Check if a signal is valid given current state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalRequest'
      responses:
        '200':
          description: signal check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SignalResponse'
  /api/v1/risk/check:
    post:
      summary: Check if a trade execution is allowed based on risk rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskCheckRequest'
      responses:
        '200':
          description: Risk check decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_RiskCheckResponse'
  /api/v1/auth/token:
    post:
      summary: Login to get access token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse'
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse'
  /api/v1/auth/profile:
    get:
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse'
  /api/v1/funds:
    get:
      summary: List funds for current user
      responses:
        '200':
          description: List of funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Fund'
    post:
      summary: Create a new fund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundCreate'
      responses:
        '201':
          description: Fund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Fund'
  /api/v1/strategies:
    get:
      summary: List strategies for a fund
      parameters:
        - name: fund_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of strategies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_StrategyResponse'
    post:
      summary: Create a new strategy configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyCreate'
      responses:
        '201':
          description: Strategy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_StrategyResponse'
  /api/v1/journal/:
    get:
      summary: List journal entries for current user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of journal entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_JournalEntryResponse'
    post:
      summary: Create a new journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryCreate'
      responses:
        '200':
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_JournalEntryResponse'
  /api/v1/journal/{entry_id}:
    get:
      summary: Get journal entry details
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Journal entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_JournalEntryResponse'
  /backtest/run:
    post:
      summary: Trigger a backtest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: Backtest started/completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_BacktestResponse'
  /backtest/results/{backtest_id}:
    get:
      summary: Get results of a specific backtest
      parameters:
        - name: backtest_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_BacktestResponse'

components:
  schemas:
    # --- Standard Response Wrappers ---
    ResponseStatus:
      type: string
      enum: [success, error, fail]
    
    ErrorCode:
      type: string
      enum:
        - AUTH_1001
        - AUTH_1002
        - AUTH_1003
        - AUTH_1004
        - AUTH_1005
        - VAL_2001
        - VAL_2002
        - VAL_2003
        - VAL_2004
        - VAL_2005
        - VAL_2006
        - VAL_2007
        - RES_3001
        - RES_3002
        - RES_3003
        - BIZ_4001
        - BIZ_4002
        - BIZ_4003
        - BIZ_4004
        - RATE_5001
        - RATE_5002
        - SRV_9001
        - SRV_9002
        - SRV_9003
        - SRV_9004

    Meta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    AuthTokens:
      type: object
      required:
        - access_token
        - expires_in
        - expires_at
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
        expires_at:
          type: string
          format: date-time

    RateLimitInfo:
      type: object
      required:
        - limit
        - remaining
        - reset
        - reset_in_seconds
      properties:
        limit:
          type: integer
        remaining:
          type: integer
        reset:
          type: string
          format: date-time
        reset_in_seconds:
          type: integer

    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'

    # --- Generic Wrappers (instantiated for each type) ---
    # Note: OpenAPI 3.0 doesn't support generics directly, so we define explicit types.
    
    APIResponse_SignalResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          $ref: '#/components/schemas/SignalResponse'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    APIResponse_RiskCheckResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          $ref: '#/components/schemas/RiskCheckResponse'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    APIResponse_UserResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          $ref: '#/components/schemas/UserResponse'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    APIResponse_Fund:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          $ref: '#/components/schemas/Fund'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    APIResponse_StrategyResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          $ref: '#/components/schemas/StrategyResponse'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    APIResponse_JournalEntryResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          $ref: '#/components/schemas/JournalEntryResponse'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    APIResponse_BacktestResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          $ref: '#/components/schemas/BacktestResponse'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    PaginatedResponse_Fund:
      type: object
      required:
        - status
        - data
        - meta
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Fund'
        message:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    PaginatedResponse_StrategyResponse:
      type: object
      required:
        - status
        - data
        - meta
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          type: array
          items:
            $ref: '#/components/schemas/StrategyResponse'
        message:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    PaginatedResponse_JournalEntryResponse:
      type: object
      required:
        - status
        - data
        - meta
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntryResponse'
        message:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    # --- Domain Schemas ---
    SignalRequest:
      type: object
      properties:
        symbol:
          type: string
        timeframe:
          type: string
    SignalResponse:
      type: object
      properties:
        symbol:
          type: string
        timeframe:
          type: string
        timestamp:
          type: string
          format: date-time
        direction:
          type: string
          enum: [LONG, SHORT]
        entry_price:
          type: number
        sl_price:
          type: number
        tp_price:
          type: number
        reason:
          type: string
    RiskCheckRequest:
      type: object
      required:
        - risk_usd
        - sl_distance_usd
        - min_lot
      properties:
        risk_usd:
          type: number
          description: Maximum risk in USD allowed for this trade
        sl_distance_usd:
          type: number
          description: Distance to stop loss in USD (per unit/contract)
        min_lot:
          type: number
          description: Minimum allowed lot size (e.g., 0.01)
    RiskCheckResponse:
      type: object
      properties:
        can_execute:
          type: boolean
        lot:
          type: number
        reason:
          type: string
    UserCreate:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        is_active:
          type: boolean
    Fund:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
    FundCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    StrategyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        config_json:
          type: object
        is_active:
          type: boolean
    StrategyCreate:
      type: object
      required:
        - name
        - fund_id
        - type
        - config_json
      properties:
        name:
          type: string
        fund_id:
          type: string
          format: uuid
        type:
          type: string
        config_json:
          type: object
    JournalEntryCreate:
      type: object
      required:
        - symbol
        - direction
      properties:
        symbol:
          type: string
        direction:
          type: string
          enum: [LONG, SHORT]
        session:
          type: string
        entry_price:
          type: number
        exit_price:
          type: number
        pnl_amount:
          type: number
        pnl_r:
          type: number
        risk_amount:
          type: number
        stop_loss_price:
          type: number
        take_profit_price:
          type: number
        context_score:
          type: integer
          minimum: 1
          maximum: 10
        game_level:
          type: string
          enum: [A_GAME, B_GAME, C_GAME]
        mental_state:
          type: object
          properties:
            greed_level:
              type: integer
            fear_level:
              type: integer
            tilt_level:
              type: integer
            confidence_level:
              type: integer
            discipline_level:
              type: integer
        timeline_events:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string
              order_index:
                type: integer
        root_cause:
          type: object
          properties:
            problem:
              type: string
            why_exist:
              type: string
            flaw:
              type: string
            correction:
              type: string
            logic:
              type: string
    JournalEntryResponse:
      allOf:
        - $ref: '#/components/schemas/JournalEntryCreate'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    
    BacktestRequest:
      type: object
      required:
        - strategy_id
        - symbol
        - timeframe
        - start_date
        - end_date
        - initial_capital
      properties:
        strategy_id:
          type: string
          format: uuid
        symbol:
          type: string
        timeframe:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        initial_capital:
          type: number
    
    BacktestResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        metrics:
          type: object
        trades:
          type: array
          items:
            type: object