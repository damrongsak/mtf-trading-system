openapi: 3.0.0
info:
  title: MTF Trading API
  version: 0.1.0
paths:
  /api/v1/alpha/test:
    post:
      summary: Run detailed backtest for alpha formula
      tags: [Alpha]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlphaRequest'
      responses:
        '200':
          description: Alpha backtest results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Alpha'

  /api/v1/alpha/preview:
    post:
      summary: Run lightweight preview for alpha formula
      tags: [Alpha]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlphaRequest'
      responses:
        '200':
          description: Alpha preview results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Alpha'
  
  /api/v1/data-sources:
    get:
      summary: List all data sources
      responses:
        '200':
          description: List of data sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DataSourceList'
    post:
      summary: Create a new data source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceCreate'
      responses:
        '200':
          description: Created data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DataSource'

  # --- Prompt Endpoints ---
  /api/v1/prompts:
    get:
      summary: List system prompts
      parameters:
        - name: owner_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of prompts
          content:
             application/json:
               schema:
                 type: array
                 items:
                   $ref: '#/components/schemas/SystemPromptResponse'
    post:
      summary: Create new system prompt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPromptCreate'
      responses:
         '200':
           description: Prompt Created
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemPromptResponse'

  /api/v1/prompts/{id}:
    get:
      summary: Get system prompt details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
           description: Prompt Details
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemPromptResponse'
    put:
      summary: Update system prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
             type: string
             format: uuid
      requestBody:
        content:
          application/json:
             schema:
               $ref: '#/components/schemas/SystemPromptUpdate'
      responses:
        '200':
          description: Prompt updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'

  /api/v1/prompts/{id}/render:
     post:
       summary: Render prompt with variables
       parameters:
         - name: id
           in: path
           required: true
           schema:
             type: string
             format: uuid
       requestBody:
         content:
           application/json:
             schema:
               type: object
               required:
                 - variables
               properties:
                 variables:
                   type: object
       responses:
         '200':
            description: Rendered Text
            content:
              application/json:
                schema:
                  type: object
                  properties:
                     rendered_text:
                       type: string
                     missing_variables:
                       type: array
                       items:
                         type: string

  /api/v1/ai/agents:
    get:
      summary: List available AI Agents
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_AgentList'

  /api/v1/ai/agents/{id}:
    get:
      summary: Get AI Agent details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent details
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/APIResponse_Agent'

  /api/v1/plugins:
    get:
      summary: List all plugins
      responses:
        '200':
          description: List of plugins

  /api/v1/plugins/{id}/activate:
    post:
      summary: Activate a plugin for current user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: 
                    type: string
                    example: "active"

  /api/v1/plugins/{id}/deactivate:
    post:
      summary: Deactivate a plugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin deactivated

  /api/v1/plugins/{id}/config:
    put:
      summary: Update plugin configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginConfigUpdate'
      responses:
        '200':
          description: Configuration updated

  /api/v1/data-sources/{id}:
    get:
      summary: Get a specific data source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Data source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DataSource'
    put:
      summary: Update a data source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceUpdate'
      responses:
        '200':
          description: Updated data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DataSource'
    delete:
      summary: Delete a data source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Data source deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/data-sources/{id}/backfill:
    post:
      summary: Trigger a historical backfill
      description: Proxies the request to the Data Pipeline service to fetch and ingest historical candles.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
                - timeframe
              properties:
                symbol:
                  type: string
                  example: "EUR_USD"
                timeframe:
                  type: string
                  example: "H1"
                count:
                  type: integer
                  default: 500
      responses:
        '202':
          description: Backfill job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  job_id:
                    type: string

  /api/v1/deployments/:
    get:
      summary: List all deployments
      responses:
        '200':
          description: List of deployments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DeploymentList'
    post:
      summary: Create a new deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreate'
      responses:
        '200':
          description: Created deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Deployment'

  /api/v1/deployments/{id}/stop:
    post:
      summary: Stop a deployment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Deployment'

  /api/v1/ai/chat/sessions:
    get:
      summary: List chat sessions
      parameters:
        - name: strategy_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of chat sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_ChatSessionList'
    post:
      summary: Create a new chat session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionCreate'
      responses:
        '201':
          description: Created chat session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_ChatSession'

  /api/v1/ai/briefing:
    get:
      summary: Get latest daily briefing
      responses:
        '200':
          description: Latest briefing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Briefing'
    post:
      summary: Trigger generation of a new briefing
      responses:
        '200':
          description: Briefing generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Briefing'


  /api/v1/ai/agent/observer/run:
    post:
      summary: Run Market Observer Agent
      description: Trigger the AI Market Observer to analyze a specific request or symbol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input_text
              properties:
                input_text:
                  type: string
                  example: "Analyze XAU/USD"
      responses:
        '200':
          description: Agent Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      report:
                        type: string
                      timestamp:
                        type: string
                        format: date-time

  /ai/chat/sessions/message:
    post:
      summary: Chat with Strategy Advisor
      description: Direct chat endpoint for Strategy Advisor agent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyChatRequest'
      responses:
        '200':
          description: AI Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: 
                    type: string
                  timestamp:
                    type: string
        '503':
           description: Agent Unavailable

  /api/v1/ai/ingest/upload:
    post:
      summary: Upload context file
      description: Upload a file (PDF, Image) for AI context.
      requestBody:
        content:
           multipart/form-data:
             schema:
               type: object
               properties:
                 file:
                   type: string
                   format: binary
                 user_id:
                   type: string
                 context_type:
                   type: string
      responses:
        '200':
          description: File uploaded
          content:
             application/json:
               schema:
                 type: object
                 properties:
                   filename:
                     type: string
                   context_ref:
                     type: object

  /api/v1/ai/chat/sessions/{session_id}/messages:
    get:
      summary: Get messages for a session
      parameters:
         - name: session_id
           in: path
           required: true
           schema:
             type: string
             format: uuid
      responses:
        '200':
           description: List of messages
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/APIResponse_ChatMessageList'
    post:
      summary: Send a message to the AI
      parameters:
         - name: session_id
           in: path
           required: true
           schema:
             type: string
             format: uuid
      requestBody:
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/ChatMessageCreate'
      responses:
        '200':
          description: AI Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_ChatMessage'

  /api/v1/stream/prices:
    get:
      summary: WebSocket for real-time price updates
      description: |
        Connect via WebSocket to receive real-time tick data for specified symbols.
        URL: ws://{host}/api/v1/stream/prices
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: JWT Access Token
        - name: symbols
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated list of symbols (e.g., "EUR_USD,XAU_USD")
      responses:
        '101':
          description: Switching Protocols to WebSocket
        '401':
          description: Unauthorized


  /api/v1/signal/latest/{symbol}:
    get:
      summary: Get the latest signal for a specific symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SignalResponse'
  /api/v1/signal/detected:
    get:
      summary: Get detected signals history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of detected signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SignalList'

  /api/v1/signals/{id}/approve:
    post:
      summary: Approve a pending signal
      description: Manually trigger execution for a signal in PENDING_APPROVAL state.
      tags: [Execution]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signal approved and executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "executed"
                  execution_response:
                    type: object

  /api/v1/signals/{id}/reject:
    post:
      summary: Reject a pending signal
      description: Mark a PENDING_APPROVAL signal as REJECTED.
      tags: [Execution]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signal rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "rejected"

  /api/v1/internal/signals:
    post:
      summary: Report a signal from an internal service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                direction:
                  type: string
                timeframe:
                  type: string
                confidence:
                  type: number
                price:
                  type: number
                reason:
                  type: string
                deployment_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Signal processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Success'

  /api/v1/signal/check:
    post:
      summary: Check if a signal is valid given current state
      requestBody:
        required: true
        content:
          application/json:
            schema:

              type: object
              properties:
                fund_id:
                  type: string
                  format: uuid
                symbol: 
                  type: string
                direction:
                  type: string
                  enum: ["BULLISH", "BEARISH"]
                stop_loss:
                  type: number
                risk_usd:
                  type: number
                  description: "Optional override for risk calculation"
                generated_by:
                  type: string
                reason: 
                  type: string
      responses:
        '200':
          description: signal check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SignalResponse'
  /api/v1/signal/batch:
    post:
      summary: Fetch batch signals for multiple symbols
      description: Orchestrates symbol discovery, candle fetching, and batch SMC analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalBatchRequest'
      responses:
        '200':
          description: Batch of signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SignalList'
  /api/v1/market/symbols:
    get:
      summary: Get active symbols for a broker
      description: Returns a list of active market symbols (is_active=True) for the specified data source.
      parameters:
        - name: broker
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of active symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketSymbolResponse'
  /api/v1/data/open-interest/upload:
    post:
      summary: Upload Open Interest Matrix Excel
      description: Proxies the upload to the data-pipeline service.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      parameters:
        - name: snapshot_at
          in: query
          schema:
            type: string
            format: date-time
          description: Optional snapshot timestamp override
      responses:
        '201':
          description: Data imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  records_processed:
                    type: integer
                  snapshot_at:
                    type: string
  /api/v1/data/open-interest/snapshots:
    get:
      summary: Get Open Interest Snapshots
      description: Returns a list of available Open Interest snapshots.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                     snapshot_at:
                       type: string
                       format: date-time
                     count:
                       type: integer
                     created_at:
                       type: string
                       format: date-time

  /api/v1/data/open-interest/analysis:
    get:
      summary: Get Open Interest Analysis
      parameters:
        - name: snapshot_at
          in: query
          description: "Optional snapshot time (defaults to latest)"
          schema:
            type: string
            format: date-time
        - name: contract
          in: query
          description: "Optional contract filter"
          schema:
            type: string
        - name: smart_filter
          in: query
          description: "Apply smart range filtering (std dev)"
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Analytics data (PCR, Max Pain, Net Delta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_OpenInterestAnalytics'



  /api/v1/analysis/calculate/smc:
    post:
      summary: Calculate Smart Money Concepts (SMC)
      description: Detects Order Blocks, FVGs, Liquidity Sweeps, and Market Structure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMCRequest'
      responses:
        '200':
          description: SMC Analysis Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMCResponse'


  /api/v1/analysis/calculate/ema:
    post:
      summary: Calculate EMA
      tags: [Analysis]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmaRequest'
      responses:
        '200':
          description: EMA Calculation Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorResponse'

  /api/v1/analysis/calculate/rsi:
    post:
      summary: Calculate RSI
      tags: [Analysis]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RsiRequest'
      responses:
        '200':
          description: RSI Calculation Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorResponse'

  /api/v1/analysis/calculate/atr:
    post:
      summary: Calculate ATR
      tags: [Analysis]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtrRequest'
      responses:
        '200':
          description: ATR Calculation Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorResponse'

  /api/v1/analysis/calculate/macd:
    post:
      summary: Calculate MACD
      tags: [Analysis]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MacdRequest'
      responses:
        '200':
          description: MACD Calculation Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacdResponse'

  /api/v1/analysis/calculate/adx:
    post:
      summary: Calculate ADX
      tags: [Analysis]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdxRequest'
      responses:
        '200':
          description: ADX Calculation Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdxResponse'
  /api/v1/data/open-interest/details:
    get:
      summary: Get Open Interest Details
      parameters:
        - name: snapshot_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: contract
          in: query
          description: "Optional contract filter"
          schema:
            type: string
        - name: min_oi
          in: query
          description: "Minimum OI filter"
          schema:
            type: integer
            default: 2000
        - name: max_oi
          in: query
          description: "Maximum OI filter"
          schema:
            type: integer
            default: 5500
        - name: smart_filter
          in: query
          description: "Apply smart range filtering (std dev)"
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Detailed active OI records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenInterestCommon'

  /api/v1/data/symbols/{symbol_id}:
    patch:
      summary: Update symbol status
      parameters:
        - name: symbol_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketSymbolUpdate'
      responses:
        '200':
          description: Symbol updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSymbolResponse'
  /api/v1/risk/check:
    post:
      summary: Check if a trade execution is allowed based on risk rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskCheckRequest'
      responses:
        '200':
          description: Risk check decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_RiskCheckResponse'
  /api/v1/auth/token:
    post:
      summary: Login to get access token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse'
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse'
  /api/v1/auth/profile:
    get:
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse'
  /api/v1/auth/profile/avatar:
    post:
      summary: Upload user avatar
      requestBody:
        content:
