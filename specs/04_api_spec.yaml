openapi: 3.0.0
info:
  title: MTF Trading API
  version: 0.1.0
paths:
  /api/v1/signal/latest/{symbol}:
    get:
      summary: Get the latest signal for a specific symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SignalResponse'
  /api/v1/signal/check:
    post:
      summary: Check if a signal is valid given current state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalRequest'
      responses:
        '200':
          description: signal check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SignalResponse'
  /api/v1/signal/batch:
    post:
      summary: Fetch batch signals for multiple symbols
      description: Orchestrates symbol discovery, candle fetching, and batch SMC analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalBatchRequest'
      responses:
        '200':
          description: Batch of signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SignalList'
  /api/v1/data/symbols:
    get:
      summary: Get active symbols for a broker
      parameters:
        - name: broker
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of active symbols
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SymbolList'
  /api/v1/risk/check:
    post:
      summary: Check if a trade execution is allowed based on risk rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskCheckRequest'
      responses:
        '200':
          description: Risk check decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_RiskCheckResponse'
  /api/v1/auth/token:
    post:
      summary: Login to get access token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse'
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse'
  /api/v1/auth/profile:
    get:
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse'
  /api/v1/auth/profile/avatar:
    post:
      summary: Upload user avatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse'
  /api/v1/settings/preferences:
    get:
      summary: Get current user preferences
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserPreferencesResponse'
    put:
      summary: Update user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesDto'
      responses:
        '200':
          description: Updated user preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserPreferencesResponse'
  /api/v1/accounts/:
    get:
      summary: List broker accounts
      responses:
        '200':
          description: List of broker accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_BrokerAccountList'
    post:
      summary: Add a new broker account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerAccountCreate'
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_BrokerAccount'

  /api/v1/accounts/{account_id}:
    put:
      summary: Update a broker account
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerAccountUpdate'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_BrokerAccount'
    delete:
      summary: Delete a broker account
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Success'

  /api/v1/funds:
    get:
      summary: List funds for current user
      responses:
        '200':
          description: List of funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Fund'
    post:
      summary: Create a new fund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundCreate'
      responses:
        '201':
          description: Fund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Fund'
                $ref: '#/components/schemas/APIResponse_StrategyResponse'
  /api/v1/strategies/templates:
    get:
      summary: List available strategy templates
      responses:
        '200':
          description: List of strategy templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_StrategyTemplateList'
  /api/v1/strategies/{id}/config:
    post:
      summary: Update configuration for a strategy instance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyConfigUpdate'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_StrategyResponse'
  /api/v1/journal/:
    get:
      summary: List journal entries for current user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of journal entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_JournalEntryResponse'
    post:
      summary: Create a new journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryCreate'
      responses:
        '200':
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_JournalEntryResponse'
  /api/v1/journal/{entry_id}:
    get:
      summary: Get journal entry details
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Journal entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_JournalEntryResponse'
  /backtest/run:
    post:
      summary: Trigger a backtest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: Backtest started/completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_BacktestResponse'
  /backtest/optimize:
    post:
      summary: Run an optimization job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: Optimization results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_BacktestResponse' # Reusing BacktestResponse for now as it contains best_params
  /backtest/monte-carlo:
    post:
      summary: Run a Monte Carlo simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonteCarloRequest'
      responses:
        '200':
          description: Monte Carlo results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonteCarloResponse'
  /backtest/custom:
    post:
      summary: Run a custom strategy backtest
      description: Compiles and runs user-provided Python code against historical data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyBacktestRequest'
      responses:
        '200':
          description: Custom backtest results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_BacktestResponse'
  /saved-strategies:
    get:
      summary: List saved strategies
      responses:
        '200':
          description: List of strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedStrategyResponse'
    post:
      summary: Create a saved strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedStrategyCreate'
      responses:
        '201':
          description: Strategy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedStrategyResponse'

  /saved-strategies/{id}:
    get:
      summary: Get saved strategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Strategy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedStrategyResponse'
    put:
      summary: Update saved strategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedStrategyUpdate'
      responses:
        '200':
          description: Strategy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedStrategyResponse'
    delete:
      summary: Delete saved strategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Strategy deleted

  /backtest/results/{backtest_id}:
    get:
      summary: Get results of a specific backtest
      parameters:
        - name: backtest_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_BacktestResponse'
  /api/v1/transactions:
    get:
      summary: List transactions
      parameters:
        - name: fund_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_TransactionResponse'
    post:
      summary: Create a manual transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_TransactionResponse'
  /api/v1/transactions/import:
    post:
      summary: Import transactions from Excel
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                fund_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_TransactionImportResponse'
  /api/v1/transactions/balance:
    get:
      summary: Get fund balance
      parameters:
        - name: fund_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_BalanceResponse'
  /api/v1/market/categories:
    get:
      summary: List market categories
      responses:
        '200':
          description: List of market categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketCategory'
    post:
      summary: Create a new market category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketCategoryCreate'
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketCategory'

  /api/v1/market/categories/{category_id}/symbols:
    post:
      summary: Add a symbol to a category
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketSymbolCreate'
      responses:
        '201':
          description: Added symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSymbol'

  /api/v1/data/ingest/manual:
    post:
      summary: Manually trigger the OANDA data ingestion job.
      description: This endpoint triggers the background job responsible for fetching recent OANDA candle data across configured symbols and timeframes, and storing it in the database. Returns a 202 Accepted response upon successful triggering of the background task.
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          description: Optional symbol to ingest (e.g., EUR_USD). If omitted, defaults to configured symbols.
      responses:
        '202':
          description: Ingestion job triggered in background.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Ingestion job triggered in background
  /api/v1/data/upload:
    post:
      summary: Upload historical data CSV
      description: Bulk upload of historical candle data via CSV. Handles large files via Nginx proxy. Supports standard OHLCV formats including MetaTrader and Dukascopy.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  rows_processed:
                    type: integer
  /api/v1/execution/trades:
    get:
      summary: List trades with filtering and pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, CLOSED, REJECTED, ALL]
        - name: symbol
          in: query
          schema:
            type: string
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of trades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_TradeResponse'
  /api/v1/execution/trades/{trade_id}/close:
    post:
      summary: Manually close a trade
      parameters:
        - name: trade_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - exit_price
              properties:
                exit_price:
                  type: number
      responses:
        '200':
          description: Trade closed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Success'
    
  /api/v1/execution/orders:
    post:
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object # Simplify for now or look up OrderRequest
      responses:
        '200':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Success'

  /api/v1/data/candles:
    get:
      summary: Fetch historical candle data
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
      responses:
        '200':
          description: List of candles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candle'

  /api/v1/analysis/indicators:
    get:
      summary: Get multiple technical indicators
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: true
          schema:
            type: string
        - name: indicators
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Calculated indicators
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object

  /api/v1/analysis/levels/indicators/{indicator_type}:
    get:
      summary: Get specific indicator data
      parameters:
        - name: indicator_type
          in: path
          required: true
          schema:
            type: string
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Indicator data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/v1/execution/account/summary:
    get:
      summary: Get account summary
      responses:
        '200':
          description: Account summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Success'

components:
  schemas:
    # --- Standard Response Wrappers ---
    ResponseStatus:
      type: string
      enum: [success, error, fail]
    
    ErrorCode:
      type: string
      enum:
        - AUTH_1001
        - AUTH_1002
        - AUTH_1003
        - AUTH_1004
        - AUTH_1005

    StrategyBacktestRequest:
      type: object
      required:
        - code
        - symbol
        - timeframe
        - start_date
        - end_date
        - initial_capital
      properties:
        code:
          type: string
          description: "Python code defining the strategy (async def strategy...)"
        symbol:
          type: string
        timeframe:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        initial_capital:
          type: number
          default: 10000.0
        - VAL_2001
        - VAL_2002
        - VAL_2003
        - VAL_2004
        - VAL_2005
        - VAL_2006
        - VAL_2007
        - RES_3001
        - RES_3002
        - RES_3003
        - BIZ_4001
        - BIZ_4002
        - BIZ_4003
        - BIZ_4004
        - RATE_5001
        - RATE_5002
        - SRV_9001
        - SRV_9002
        - SRV_9003
        - SRV_9004

    Meta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    AuthTokens:
      type: object
      required:
        - access_token
        - expires_in
        - expires_at
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
        expires_at:
          type: string
          format: date-time

    RateLimitInfo:
      type: object
      required:
        - limit
        - remaining
        - reset
        - reset_in_seconds
      properties:
        limit:
          type: integer
        remaining:
          type: integer
        reset:
          type: string
          format: date-time
        reset_in_seconds:
          type: integer

    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'

    # --- Generic Wrappers (instantiated for each type) ---
    # Note: OpenAPI 3.0 doesn't support generics directly, so we define explicit types.
    
    APIResponse_SignalResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          $ref: '#/components/schemas/SignalResponse'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    Candle:
      type: object
      required:
        - time
        - open
        - high
        - low
        - close
        - volume
      properties:
        time:
          type: string
          format: date-time
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: integer
        is_complete:
          type: boolean

    APIResponse_RiskCheckResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          $ref: '#/components/schemas/RiskCheckResponse'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

    APIResponse_UserResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        data:
          $ref: '#/components/schemas/UserResponse'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        rate_limit:
          $ref: '#/components/schemas/RateLimitInfo'
        timestamp:
          type: string
          format: date-time

