          type: string
        gap_start:
          type: string
          format: date-time
        gap_end:
          type: string
          format: date-time
        missing_count:
          type: integer

    GapDiscoveryResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        discovery_days:
          type: integer
        gaps_found:
          type: integer
        details:
          type: array
          items:
            $ref: '#/components/schemas/GapInfo'

    APIResponse_OrchestrationLogs:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  source_agent:
                    type: string
                  target_agent:
                    type: string
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

    APIResponse_PipelineStatus:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                type: object
                properties:
                   status:
                     type: string
                   last_run:
                     type: string
                   monitored_symbol:
                     type: string
                   current_reference_score:
                     type: number



    AIThinkRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: "User input or command"
        intent:
          type: string
          description: "Optional hint for the orchestrator (e.g. 'briefing', 'market_analysis')"
        context:
          type: object
          description: "Additional dynamic context (deployment_id, strategy_id, symbol)"
        image_b64:
          type: string
