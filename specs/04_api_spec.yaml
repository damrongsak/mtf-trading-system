openapi: 3.0.0
info:
  title: MTF Trading API
  version: 0.1.0
paths:
  /api/v1/alpha/test:
    post:
      summary: Run detailed backtest for alpha formula
      tags: [Alpha]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlphaRequest'
      responses:
        '200':
          description: Alpha backtest results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Alpha'

  /api/v1/alpha/preview:
    post:
      summary: Run lightweight preview for alpha formula
      tags: [Alpha]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlphaRequest'
      responses:
        '200':
          description: Alpha preview results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Alpha'
  
  /api/v1/data-sources:
    get:
      summary: List all data sources
      responses:
        '200':
          description: List of data sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DataSourceList'
    post:
      summary: Create a new data source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceCreate'
      responses:
        '200':
          description: Created data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DataSource'

  # --- Prompt Endpoints ---
  /api/v1/prompts:
    get:
      summary: List system prompts
      parameters:
        - name: owner_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of prompts
          content:
             application/json:
               schema:
                 type: array
                 items:
                   $ref: '#/components/schemas/SystemPromptResponse'
    post:
      summary: Create new system prompt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPromptCreate'
      responses:
         '200':
           description: Prompt Created
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemPromptResponse'

  /api/v1/prompts/{id}:
    get:
      summary: Get system prompt details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
           description: Prompt Details
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemPromptResponse'
    put:
      summary: Update system prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
             type: string
             format: uuid
      requestBody:
        content:
          application/json:
             schema:
               $ref: '#/components/schemas/SystemPromptUpdate'
      responses:
        '200':
          description: Prompt updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'

  /api/v1/prompts/{id}/render:
     post:
       summary: Render prompt with variables
       parameters:
         - name: id
           in: path
           required: true
           schema:
             type: string
             format: uuid
       requestBody:
         content:
           application/json:
             schema:
               type: object
               required:
                 - variables
               properties:
                 variables:
                   type: object
       responses:
         '200':
            description: Rendered Text
            content:
              application/json:
                schema:
                  type: object
                  properties:
                     rendered_text:
                       type: string
                     missing_variables:
                       type: array
                       items:
                         type: string

  /api/v1/ai/agents:
    get:
      summary: List available AI Agents
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_AgentList'

  /api/v1/ai/agents/{id}:
    get:
      summary: Get AI Agent details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent details
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/APIResponse_Agent'

  /api/v1/plugins:
    get:
      summary: List all plugins
      responses:
        '200':
          description: List of plugins

  /api/v1/plugins/{id}/activate:
    post:
      summary: Activate a plugin for current user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: 
                    type: string
                    example: "active"

  /api/v1/plugins/{id}/deactivate:
    post:
      summary: Deactivate a plugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin deactivated

  /api/v1/plugins/{id}/config:
    put:
      summary: Update plugin configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginConfigUpdate'
      responses:
        '200':
          description: Configuration updated

  /api/v1/data-sources/{id}:
    get:
      summary: Get a specific data source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Data source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DataSource'
    put:
      summary: Update a data source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceUpdate'
      responses:
        '200':
          description: Updated data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DataSource'
    delete:
      summary: Delete a data source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Data source deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/data-sources/{id}/backfill:
    post:
      summary: Trigger a historical backfill
      description: Proxies the request to the Data Pipeline service to fetch and ingest historical candles.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
      responses:
        '202':
          description: Backfill job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  job_id:
                    type: string

  /api/v1/data/history/pit:
    post:
      summary: Point-in-Time Historical Data Recall
      description: Returns labelled historical candle data for a specific period.
      tags: [Data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PITRecallRequest'
      responses:
        '200':
          description: Historical candle data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_PITRecall'

  /api/v1/discovery/gaps:
    get:
      summary: Discover data gaps
      description: Scans for missing candle data (gaps) for active symbols and timeframes.
      parameters:
        - name: days
          in: query
          description: Number of days to look back for gaps
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: Gap discovery results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GapDiscoveryResponse'

  /api/v1/deployments/:
    get:
      summary: List all deployments
      responses:
        '200':
          description: List of deployments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DeploymentList'
    post:
      summary: Create a new deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreate'
      responses:
        '200':
          description: Created deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Deployment'

  /api/v1/deployments/{id}/stop:
    post:
      summary: Stop a deployment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Deployment'

  /api/v1/ai/think:
    post:
      summary: Unified AI Orchestrator
      description: Single entry point for all AI Analyst requests (Chat, Briefing, Market Analysis, Journal). Routes to specialized agents via Supervisor.
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIThinkRequest'
      responses:
        '200':
          description: AI Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIThinkResponse'
        '503':
          description: Orchestrator Busy/Unavailable



  /api/v1/ai/briefing:
    get:
      summary: Get latest daily briefing
      responses:
        '200':
          description: Latest briefing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Briefing'
    post:
      summary: Trigger generation of a new briefing
      responses:
        '200':
          description: Briefing generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Briefing'

  /api/v1/ai/market-analysis:
    post:
      summary: Generate market outlook
      tags: [AI]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketAnalysisRequest'
      responses:
        '200':
          description: Market Analysis
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/APIResponse_Analysis'

  /api/v1/ai/journal-analysis:
    post:
      summary: Analyze journal entry
      tags: [AI]
      requestBody:
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/JournalAnalysisRequest'
      responses:
        '200':
           description: Journal Analysis
           content:
              application/json:
                schema:
                  $ref: '#/components/schemas/APIResponse_Analysis'

  /api/v1/ai/smc-narrative:
    post:
      summary: Generate SMC Narrative
      tags: [AI]
      requestBody:
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/SMCNarrativeRequest'
      responses:
         '200':
            description: SMC Narrative
            content:
               application/json:
                 schema:
                  $ref: '#/components/schemas/APIResponse_Analysis'

  /api/v1/ai/mri/coaching:
    post:
      summary: Get psychological coaching based on journal RAG
      tags: [AI]
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachingRequest'
      responses:
        '200':
          description: AI Coaching Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachingResponse'

  /api/v1/analysis/gamma/levels:
    get:
      tags:
        - Analysis
      summary: Get Gamma Levels and Market Regime
      description: Returns key liquidity levels (Call/Put Walls, Flip) derived from Options Open Interest.
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: XAUUSD
        - name: current_price
          in: query
          required: false
          schema:
            type: number
            format: float
      responses:
        '200':
          description: Gamma Analysis Data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
  /api/v1/analysis/oi/unified-profile:
    get:
      tags:
        - Analysis
      summary: Get Unified Open Interest Profile
      description: Centralized endpoint for current positioning, gamma levels, and sentiment drift.
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: XAUUSD
      responses:
        '200':
          description: Unified OI Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UnifiedOIProfile'

  /api/v1/analysis/sentiment/cached:
    get:
      tags:
        - Analysis
      summary: Get Cached Sentiment from Redis
      description: Fetches the sub-millisecond AI sentiment score and reason from Redis.
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: XAUUSD
      responses:
        '200':
          description: Cached Sentiment Data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/system/queue-health:
    get:
      tags:
        - System
      summary: Get Async Execution Queue Health
      description: Returns the length (LLEN) of Priority, Default, and Dead Letter Queues from Redis. Also includes Global Kill Switch status.
      responses:
        '200':
          description: Queue Health Data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/system/halt:
    post:
      tags:
        - System
      summary: Emergency System Halt
      description: Sets the Global Kill Switch in Redis (system:kill_switch=1) to prevent all new trade executions.
      responses:
        '200':
          description: System Halted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /api/v1/system/resume:
    post:
      tags:
        - System
      summary: Emergency System Resume
      description: Clears the Global Kill Switch in Redis to resume trade executions.
      responses:
        '200':
          description: System Resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  # --- Institutional Risk Management (Phase 56) ---
  /api/v1/risk/fund/{fund_id}/config:
    get:
      tags: [Risk]
      summary: Get fund-specific risk configuration
      parameters:
        - name: fund_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fund risk configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_FundRiskConfig'
    patch:
      tags: [Risk]
      summary: Update fund risk configuration
      parameters:
        - name: fund_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskAdjustmentRequest'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_FundRiskConfig'

  /api/v1/risk/fund/{fund_id}/kill-switch:
    post:
      tags: [Risk]
      summary: Toggle fund-specific kill switch
      parameters:
        - name: fund_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillSwitchRequest'
      responses:
        '200':
          description: Kill switch toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  # --- Phase 57: AI Risk Rebalancer ---
  /api/v1/risk/ai-review:
    post:
      tags: [Risk]
      summary: Trigger AI-driven risk analysis for a fund
      description: |
        Sends the fund's current risk configuration and market context to the
        AI Analyst's RiskRebalancerAgent (Gemini) for analysis. Returns a
        recommendation with suggested parameter adjustments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fund_id]
              properties:
                fund_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: AI risk recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_RiskRecommendation'

  /api/v1/risk/fund/{fund_id}/apply-recommendation:
    post:
      tags: [Risk]
      summary: Apply AI risk recommendation to fund config
      description: |
        Applies AI-suggested risk parameters (risk_percentage, max_drawdown_threshold)
        to the fund configuration and broadcasts a RISK_REBALANCE_APPLIED event
        to the Execution Service via Redis.
      parameters:
        - name: fund_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskRecommendation'
      responses:
        '200':
          description: Updated fund risk configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_FundRiskConfig'

  /api/v1/risk/rebalance-history:
    get:
      tags: [Risk]
      summary: Get rebalance history audit trail
      description: Returns paginated list of AI risk rebalancing events for audit.
      parameters:
        - name: fund_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Rebalance history list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  # --- Quant Analytics ---
  /api/v1/analytics/volatility:
    get:
      tags: [Analytics]
      summary: Get volatility metrics for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          schema:
            type: string
            default: "H1"
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        '200':
          description: Volatility metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_VolatilityMetrics'

  /api/v1/analytics/var:
    get:
      tags: [Analytics]
      summary: Get VaR/CVaR metrics for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          schema:
            type: string
            default: "H1"
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        '200':
          description: VaR/CVaR metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_VaRMetrics'

  /api/v1/analytics/factors:
    get:
      tags: [Analytics]
      summary: Get factor exposures for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          schema:
            type: string
            default: "H1"
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        '200':
          description: Factor exposures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_FactorExposures'

  /api/v1/analytics/drawdown:
    get:
      tags: [Analytics]
      summary: Get drawdown metrics for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          schema:
            type: string
            default: "H1"
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        '200':
          description: Drawdown metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_DrawdownMetrics'

  /api/v1/analytics/latency/heatmap:
    get:
      tags: [Analytics]
      summary: Get execution latency heatmap
      description: Returns aggregated latency data grouped by hour and symbol.
      responses:
        '200':
          description: Latency heatmap data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_LatencyHeatmap'

  /api/v1/analytics/performance/comparison:
    get:
      tags: [Analytics]
      summary: Compare Live vs Shadow performance
      description: Compares P&L and latency for the same signal IDs across live and shadow trades.
      responses:
        '200':
          description: Performance comparison data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_PerformanceComparison'

  /api/v1/analytics/execution/rejections:
    get:
      tags: [Analytics]
      summary: Get execution rejection audit
      description: Summarizes signal rejections by reason and count.
      responses:
        '200':
          description: Rejection audit data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_ExecutionRejection'

  /api/v1/ai/agent/observer/run:
    post:
      summary: Run Market Observer Agent
      description: Trigger the AI Market Observer to analyze a specific request or symbol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input_text
              properties:
                input_text:
                  type: string
                  example: "Analyze XAU/USD"
      responses:
        '200':
          description: Agent Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      report:
                        type: string
                      timestamp:
                        type: string
                        format: date-time

  /api/v1/ai/chat/sessions/message:
    post:
      summary: Chat with Strategy Advisor
      description: Direct chat endpoint for Strategy Advisor agent. Highly latent multi-agent response (up to 300s timeout).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyChatRequest'
      responses:
        '200':
          description: AI Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: 
                    type: string
                  timestamp:
                    type: string
        '503':
           description: Agent Unavailable
  /api/v1/knowledge/ingest:
    post:
      summary: Upload a file for knowledge ingestion
      tags: [Knowledge]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Ingestion job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                  filename:
                    type: string

  /api/v1/knowledge/ingest/batch:
    post:
      summary: Upload multiple files for knowledge ingestion
      tags: [Knowledge]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '202':
          description: Batch ingestion jobs accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id:
                          type: string
                        filename:
                          type: string

  /api/v1/knowledge/ingest/url:
    post:
      summary: Provide a URL for knowledge ingestion
      tags: [Knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '202':
          description: URL ingestion job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
