components:
  schemas:
    # --- Alpha Engine ---
    AlphaRequest:
      type: object
      required:
        - formula
        - symbol
      properties:
        formula:
          type: string
          example: "rank(close / delay(close, 5))"
        symbol:
          type: string
          example: "XAU_USD"
        timeframe:
          type: string
          example: "H1"
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
          
    AlphaResponse:
      type: object
      properties:
        signal:
          type: array
          items:
            type: number
            nullable: true
        metrics:
          type: object
          additionalProperties: true
        timestamps:
          type: array
          items:
            type: string
            format: date-time

    APIResponse_Alpha:
      type: object
      properties:
        status:
          type: string
        data:
          $ref: '#/components/schemas/AlphaResponse'
        error:
          type: string
          nullable: true

    # --- Standard Response Wrappers ---
    ResponseStatus:
      type: string
      enum: [success, error, fail]
    
    ErrorCode:
      type: string
      enum:
        - AUTH_1001
        - AUTH_1002
        - AUTH_1003
        - AUTH_1004
        - AUTH_1005
        - VAL_2001
        - VAL_2002
        - VAL_2003
        - VAL_2004
        - VAL_2005
        - VAL_2006
        - VAL_2007
        - RES_3001
        - RES_3002
        - RES_3003
        - BIZ_4001
        - BIZ_4002
        - BIZ_4003
        - BIZ_4004
        - RATE_5001
        - RATE_5002
        - SRV_9001
        - SRV_9002
        - SRV_9003
        - SRV_9004
    DataSourceType:
      type: string
      enum: [api, csv, db, websocket]
    DataSourceProvider:
      type: string
      enum: [OANDA, BINANCE]


    DataSource:
      type: object
      required:
        - name
        - provider
        - type
        - config_json
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          $ref: '#/components/schemas/DataSourceProvider'
        type:
          $ref: '#/components/schemas/DataSourceType'
        config_json:
          type: object
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DataSourceCreate:
      type: object
      required:
        - name
        - provider
        - type
        - config_json
      properties:
        name:
          type: string
        provider:
          $ref: '#/components/schemas/DataSourceProvider'
        type:
          $ref: '#/components/schemas/DataSourceType'
        config_json:
          type: object
        is_active:
          type: boolean

    DataSourceUpdate:
      type: object
      properties:
        name:
          type: string
        provider:
          $ref: '#/components/schemas/DataSourceProvider'
        type:
