[project]
name = "ai-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.0",
    "google-genai>=0.2.0",
    "langchain>=1.1.3",
    "langchain-google-genai>=4.0.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.16.1",
    "uvicorn>=0.38.0",
    "aiohttp>=3.9.0",
    "langgraph>=0.2.0",
    "pillow>=10.2.0",
    "pyportfolioopt>=1.5.5",
    "quantreo>=0.1.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.21",
    "python-json-logger>=2.0.7",
    "watchfiles>=0.24.0",
    "watchfiles>=0.24.0",
    "scikit-learn>=1.4.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "typing-extensions>=4.0.0",
    "msgpack>=1.0.0",
    "langgraph-checkpoint-redis>=0.1.0",
    "prompt-toolkit>=3.0.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
    "redisvl>=0.3.0",
    "apscheduler>=3.10.0",
    "scipy>=1.12.0",
    "tenacity>=9.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.14.3",
    "langchain-experimental>=0.4.1",
    "pgvector>=0.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
