[project]
name = "olympus-predictor"
version = "0.1.0"
description = "Hybrid Gold Price Predictor using SARIMAX and LSTM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "uvloop>=0.19.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "statsmodels>=0.14.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "yfinance>=0.2.36",
    "joblib>=1.3.2",
    "scikit-learn>=1.4.0",
    "shap>=0.44.0",
    "boruta>=0.3",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.3",
    "msgpack>=1.0.7",
    "watchfiles>=0.21.0",
    "arch>=7.0.0",
    "hmmlearn>=0.3.2"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
    "ruff>=0.1.15",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_mode = "auto"
