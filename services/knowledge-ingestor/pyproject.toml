[project]
name = "knowledge-ingestor"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Damrongsak Samanras", email = "damrongsak.sam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "dogpile-cache>=1.5.0",
    "ddgs>=8.1.1",
    "fastapi>=0.135.1",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "pypdf>=6.7.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "instructor[google-genai]>=1.7.2",
    "google-genai>=1.0.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.2.2",
    "python-json-logger>=2.0.7",
    "python-multipart>=0.0.22",
    "redis>=7.3.0",
    "sse-starlette>=2.1.0",
    "requests>=2.32.5",
    "requests-mock>=1.12.1",
    "uvicorn[standard]>=0.41.0",
    "watchfiles>=1.0.4",
    "falkordb>=1.2.0",
    "ruff>=0.9.9",
    "mypy>=1.15.0",
    "types-requests>=2.32.0.20241016",
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["falkordb.*", "requests.*"]
ignore_missing_imports = true

[tool.uv]
package = false

[project.scripts]
app = "app.ingestors.orchestrator:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
