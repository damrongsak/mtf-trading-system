[project]
name = "knowledge-ingestor"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Damrongsak Samanras", email = "damrongsak.sam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dogpile-cache>=1.5.0",
    "ddgs>=8.1.1",
    "fastapi>=0.135.1",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "pypdf>=6.7.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "redis>=7.3.0",
    "requests>=2.32.5",
    "requests-mock>=1.12.1",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.41.0",
    "watchfiles>=1.0.4",
]

[tool.uv]
package = false

[project.scripts]
app = "app.ingestors.orchestrator:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
