[project]
name = "data-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.1",
    "fastapi>=0.124.0",
    "oandapyv20>=0.7.2",
    "pandas>=2.3.3",
    "python-multipart>=0.0.1",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
    "alembic>=1.13.1",
    "redis>=5.0.1",
    "v20>=3.0.25",
    "PyYAML>=6.0",
    "openpyxl>=3.1.2",
    "python-json-logger>=2.0.7",
    "watchfiles>=0.24.0",
    "ctrader-open-api>=0.9.0",
    "cryptography>=41.0.0",
    "aiohttp>=3.9.0",
    "tenacity>=9.1.4",
    "msgpack>=1.1.2",
    "numba>=0.64.0",
    "numpy>=2.3.5",
    "yfinance>=0.2.52",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
]

[dependency-groups]
dev = [
    "coverage>=7.13.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
