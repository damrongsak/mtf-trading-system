[project]
name = "execution"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "oandapyv20>=0.7.2",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "six>=1.17.0",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pyportfolioopt>=1.5.5",
    "python-json-logger>=2.0.7",
    "watchfiles>=0.24.0",
    "ctrader-open-api>=0.9.0",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.3",
    "redis>=5.0.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "apscheduler>=3.10.4",
    "aiohttp>=3.9.0",
    "httpx>=0.28.1",
    "websockets>=15.0.1",
    "ruff>=0.15.6",
    "mypy>=1.19.1",
    "bandit>=1.9.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "scripts"]
python_files = "test_*.py"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
