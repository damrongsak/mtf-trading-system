[project]
name = "strategy-core"
version = "0.1.0"
description = "Strategy Core Service for MTF Trading System"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pandas>=2.1.4,<2.2.0",
    "vectorbt>=0.26.1",
    "pydantic>=2.5.3",
    "numpy>=1.26.3,<2.0.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "v20>=3.0.25",
    "redis>=5.0.0",
    "ipython>=8.30.0",
    "anywidget>=0.9.0",
    "quantreo>=0.1.0",
    "pyportfolioopt>=1.5.5",
    "plotly>=5.18.0",
    "python-telegram-bot>=20.0",
    "python-multipart>=0.0.21",
    "numba>=0.59.1,<0.60.0",
    "ctrader-open-api>=0.9.0",
    "arch>=7.0.0",
    "msgpack>=1.1.0",
    "psycopg[binary]>=3.1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "mypy>=1.0.0",
    "types-requests>=2.31.0",
    "types-redis>=4.6.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_mode = "auto"
