[project]
name = "strategy-core"
version = "0.1.0"
description = "Strategy Core Service for MTF Trading System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pandas>=2.1.4",
    "vectorbt>=0.26.1",
    "pydantic>=2.5.3",
    "numpy>=1.26.3",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "httpx>=0.26.0",
]
