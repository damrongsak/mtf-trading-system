### docker-compose.yml
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      # - frontend # manually run `npm run build` and `npm run start` in frontend directory
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./services/api-gateway:/app
    depends_on:
      # - postgres
      # - qdrant
      - execution
    environment:
      - EXECUTION_SERVICE_URL=http://execution:8000
      - DATABASE_URL=postgresql://trader:trader@host.docker.internal:5432/mtf_db
      - DATA_PIPELINE_URL=http://data-pipeline:8000
      - STRATEGY_CORE_URL=http://strategy-core:8000

  execution:
    build: ./services/execution
    container_name: execution
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./services/execution:/app

  data-pipeline:
    build: ./services/data-pipeline
    container_name: data-pipeline
    ports:
      - "8002:8000"
    volumes:
      - ./services/data-pipeline:/app
    depends_on:
      # - postgres
      - execution # Just to ensure order, though not strictly dependent
    environment:
      - DATABASE_URL=postgresql://trader:trader@host.docker.internal:5432/mtf_db
    networks:
      - default
      - external

  strategy-core:
    build: ./services/strategy-core
    container_name: strategy-core
    ports:
      - "8003:8000"
    volumes:
      - ./services/strategy-core:/app
    depends_on:
      - data-pipeline
    environment:
      - DATABASE_URL=postgresql://trader:trader@host.docker.internal:5432/mtf_db
    networks:
      - default
      - external

  ai-analyst:
    build: ./services/ai-analyst
    container_name: ai-analyst
    env_file: .env
    ports:
      - "8004:8000"
    volumes:
      - ./services/ai-analyst:/app
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - default
      - external

