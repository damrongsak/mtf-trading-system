### docker-compose.yml
services:
  nginx:
    image: nginx:latest
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend

  api:
    build: ./services/api-gateway
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      # - postgres
      # - qdrant
      - execution
    environment:
      - EXECUTION_SERVICE_URL=http://execution:8000

  execution:
    build: ./services/execution
    ports:
      - "8001:8000"

  data-pipeline:
    build: ./services/data-pipeline
    ports:
      - "8002:8000"
    depends_on:
      # - postgres
      - execution # Just to ensure order, though not strictly dependent
    environment:
      - DATABASE_URL=postgresql://trader:trader@pgvector:5432/mtf_db
    networks:
      - default
      - external

  strategy-core:
    build: ./services/strategy-core
    ports:
      - "8003:8000"
    volumes:
      - ./services/strategy-core:/app
    depends_on:
      - data-pipeline
    environment:
      - DATABASE_URL=postgresql://trader:trader@pgvector:5432/mtf_db
    networks:
      - default
      - external

  # Already exists in localhost
  # postgres:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_USER: trader
  #     POSTGRES_PASSWORD: trader
  #     POSTGRES_DB: mtf_db
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

  # Already exists in localhost
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_storage:/qdrant/storage

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

# volumes:
#   pgdata:
#   qdrant_storage:

networks:
  external:
    external: true
    name: orignx-network