### docker-compose.yml
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - default
      - external

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    command: /venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info --proxy-headers
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./services/api-gateway:/app
      - /app/.venv
      - ./specs:/specs
    depends_on:
      # - postgres
      # - qdrant
      - execution
    environment:
      - EXECUTION_SERVICE_URL=http://execution:8000
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - DATA_PIPELINE_URL=http://data-pipeline:8000
      - STRATEGY_CORE_URL=http://strategy-core:8000
      - REDIS_URL=redis://redis:6379/0
      - AI_ANALYST_URL=http://ai-analyst:8000
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1
      # Telegram Long Polling (set to "true" to enable; disables webhook mode)
      - TELEGRAM_POLLING_ENABLED=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - default
      - external

  execution:
    build: ./services/execution
    container_name: execution
    env_file: .env
    ports:
      - "8002:8000"
    volumes:
      - ./services/execution:/app
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - default
      - external
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1

  data-pipeline:
    build: ./services/data-pipeline
    container_name: data-pipeline
    entrypoint: /app/scripts/entrypoint.sh
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./services/data-pipeline:/app
      - ./services:/shared/services
      - /app/.venv
    depends_on:
      # - postgres
      - execution # Just to ensure order, though not strictly dependent
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - WEB_CONCURRENCY=1
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    networks:
      - default
      - external

  tick-streamer:
    build: ./services/data-pipeline
    container_name: tick-streamer
    entrypoint: /app/scripts/entrypoint-stream.sh
    command: python run_stream.py
    volumes:
      - ./services/data-pipeline:/app
      - /app/.venv
    env_file: .env
    depends_on:
      - redis
      - data-pipeline
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - STREAM_SYMBOLS=EURUSD,USDJPY,XAUUSD
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    networks:
      - default
      - external

  strategy-core:
    build: ./services/strategy-core
    container_name: strategy-core
    ports:
      - "8003:8000"
    command: /venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
    volumes:
      - ./services/strategy-core:/app
      - /app/.venv
    depends_on:
      - data-pipeline
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - NUMBA_NUM_THREADS=2
      - OMP_NUM_THREADS=2
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    networks:
      - default
      - external

  ai-analyst:
    build: ./services/ai-analyst
    container_name: ai-analyst
    env_file: .env
    volumes:
      - ./services/ai-analyst:/app
      - /app/.venv
    command: /venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - default
      - external

  olympus-predictor:
    build: ./services/olympus-predictor
    container_name: olympus-predictor
    # shm_size/ipc removed for debugging
    command: /venv/bin/uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --loop uvloop
    env_file: .env
    volumes:
      - ./services/olympus-predictor:/app
      - /app/.venv
      - ./trained_models:/app/models
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - default
      - external

  predictor-worker:
    build: ./services/olympus-predictor
    container_name: predictor-worker
    command: python -m src.app.core.worker
    env_file: .env
    volumes:
      - ./services/olympus-predictor:/app
      - /app/.venv
      - ./trained_models:/app/models
    depends_on:
      - redis
      - olympus-predictor
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - default
      - external

  mtf-postgres:
    image: postgres:15
    container_name: mtf-postgres
    ports:
      - "5432:5432"
    command: postgres -c shared_buffers=128MB -c max_connections=50
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: mtf_db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - ./infra/postgres_data:/var/lib/postgresql/data
    networks:
      - default
      - external

  # Already exists in localhost
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_storage:/qdrant/storage
  #   environment:
  #     - QDRANT__STORAGE__PATH=/qdrant/storage
  #     - QDRANT__SERVICE__GRPC_PORT=6334
  #     - QDRANT__LOGGING__LEVEL=info
  #     - QDRANT__SERVICE__API_KEY=pqFOJtR5GfwW0pzcrit6qVdgj0PuSa8jHWT7lnux3Dk=
  #     - QDRANT__CLUSTER__ENABLED=false

  # Manualy run
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - default
      - external

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --protected-mode no
    ports:
      - "6379:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - default
      - external

networks:
  external:
    external: true
    name: orignx-network
