### docker-compose.yml
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - default
      - external

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    command: /venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info --proxy-headers --timeout-keep-alive 180
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./services/api-gateway:/app
      - /app/.venv
      - ./specs:/specs
      - ./master_data:/master_data
    depends_on:
      mtf-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      execution:
        condition: service_healthy
      data-pipeline:
        condition: service_healthy
    environment:
      - EXECUTION_SERVICE_URL=http://execution:8000
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - DATA_PIPELINE_URL=http://data-pipeline:8000
      - STRATEGY_CORE_URL=http://strategy-core:8000
      - REDIS_URL=redis://redis:6379/0
      - AI_ANALYST_URL=http://ai-analyst:8000
      - PYTHONUNBUFFERED=1
      # Telegram Long Polling (set to "true" to enable; disables webhook mode)
      - TELEGRAM_POLLING_ENABLED=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - default
      - external

  execution:
    build: ./services/execution
    container_name: execution
    command: /venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8002:8000"
    volumes:
      - ./services/execution:/app
      - ./services/execution/deps:/app/deps
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - default
      - external
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - DATA_PIPELINE_URL=http://data-pipeline:8000
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1
      - PYTHONPATH=/app:/app/deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mtf-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  data-pipeline:
    build: ./services/data-pipeline
    container_name: data-pipeline
    entrypoint: /app/scripts/entrypoint.sh
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./services/data-pipeline:/app
      - ./services/data-pipeline/deps:/app/deps
      - ./services:/shared/services
      - /app/.venv
    depends_on:
      mtf-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - WEB_CONCURRENCY=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
    networks:
      - default
      - external

  tick-streamer:
    build: ./services/data-pipeline
    container_name: tick-streamer
    entrypoint: /app/scripts/entrypoint-stream.sh
    command: python run_stream.py
    volumes:
      - ./services/data-pipeline:/app
      - ./services/data-pipeline/deps:/app/deps
      - /app/.venv
    env_file: .env
    environment:
      - PYTHONPATH=/app:/app/deps
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - STREAM_SYMBOLS=EURUSD,USDJPY,XAUUSD
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
    depends_on:
      redis:
        condition: service_healthy
      data-pipeline:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    networks:
      - default
      - external

  strategy-core:
    build: ./services/strategy-core
    container_name: strategy-core
    ports:
      - "8003:8000"
    command: /venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
    volumes:
      - ./services/strategy-core:/app
      - /app/.venv
    depends_on:
      mtf-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-pipeline:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - NUMBA_NUM_THREADS=2
      - OMP_NUM_THREADS=2
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    networks:
      - default
      - external

  ai-analyst:
    build: ./services/ai-analyst
    container_name: ai-analyst
    env_file: .env
    volumes:
      - ./services/ai-analyst:/app
      - /app/.venv
    command: /venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 180
    depends_on:
      mtf-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - OPENCLAW_URL=http://host.docker.internal:18789
      - PYTHONPATH=/app:/app/deps
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-9b0cb07e142a651540bf2659bb8663ea62641504e8d81309}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    networks:
      - default
      - external

  knowledge-ingestor:
    build: ./services/knowledge-ingestor
    container_name: knowledge-ingestor
    env_file: .env
    ports:
      - "8004:8000"
    volumes:
      - ./services/knowledge-ingestor:/app
      - /app/.venv
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - FALKORDB_URL=redis://falkordb:6379
      - FALKOR_HOST=${FALKOR_HOST:-falkordb}
      - FALKOR_PORT=${FALKOR_PORT:-6379}
      - GRAPH_NAME=${FALKOR_GRAPH_NAME:-OlympusKnowledgeGraph}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MODEL_NAME=${KI_MODEL_NAME:-google/gemini-2.5-flash}
      - FALLBACK_MODEL_NAME=${KI_FALLBACK_MODEL_NAME:-google/gemini-2.0-flash-001}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - default
      - external

  olympus-predictor:
    build: ./services/olympus-predictor
    container_name: olympus-predictor
    # shm_size/ipc removed for debugging
    command: /venv/bin/uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --loop uvloop
    env_file: .env
    volumes:
      - ./services/olympus-predictor:/app
      - /app/.venv
      - ./trained_models:/app/models
    depends_on:
      mtf-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - default
      - external

  predictor-worker:
    build: ./services/olympus-predictor
    container_name: predictor-worker
    command: python -m src.app.core.worker
    env_file: .env
    volumes:
      - ./services/olympus-predictor:/app
      - /app/.venv
      - ./trained_models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      olympus-predictor:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - default
      - external

  mtf-postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: mtf-postgres
    ports:
      - "5432:5432"
    # command: postgres -c shared_buffers=128MB -c max_connections=50
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: mtf_db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2GB
    volumes:
      - ./infra/pgvector_data:/var/lib/postgresql/data
      - ./infra/init-vector.sh:/docker-entrypoint-initdb.d/init-vector.sh
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=1.5GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d mtf_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - external

  # Already exists in localhost
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_storage:/qdrant/storage
  #   environment:
  #     - QDRANT__STORAGE__PATH=/qdrant/storage
  #     - QDRANT__SERVICE__GRPC_PORT=6334
  #     - QDRANT__LOGGING__LEVEL=info
  #     - QDRANT__SERVICE__API_KEY=pqFOJtR5GfwW0pzcrit6qVdgj0PuSa8jHWT7lnux3Dk=
  #     - QDRANT__CLUSTER__ENABLED=false

  # Manualy run
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - default
      - external
    depends_on:
      api-gateway:
        condition: service_started

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    environment:
      - REDIS_ARGS=--maxmemory 300mb --maxmemory-policy allkeys-lru --protected-mode no
    ports:
      - "6379:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - external

  # FalkorDB: The Graph Intelligence Engine (Uses Redis Protocol)
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      - "6380:6379" # Changed host port to 6380 to avoid conflict with Redis
      - "3001:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ./infra/falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - external

networks:
  external:
    external: true
    name: orignx-network
