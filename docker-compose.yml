### docker-compose.yml
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - frontend # manually run `npm run build` and `npm run start` in frontend directory
    networks:
      - default
      - external

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./services/api-gateway:/app
    depends_on:
      # - postgres
      # - qdrant
      - execution
    environment:
      - EXECUTION_SERVICE_URL=http://execution:8000
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - DATA_PIPELINE_URL=http://data-pipeline:8000
      - STRATEGY_CORE_URL=http://strategy-core:8000
      - REDIS_URL=redis://redis:6379/0
      - AI_ANALYST_URL=http://ai-analyst:8000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    networks:
      - default
      - external

  execution:
    build: ./services/execution
    container_name: execution
    env_file: .env
    ports:
      - "8002:8000"
    volumes:
      - ./services/execution:/app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - default
      - external
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}

  data-pipeline:
    build: ./services/data-pipeline
    image: mtf-data-pipeline
    container_name: data-pipeline
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./services/data-pipeline:/app
    depends_on:
      # - postgres
      - execution # Just to ensure order, though not strictly dependent
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
    networks:
      - default
      - external

  tick-streamer:
    image: mtf-data-pipeline
    container_name: tick-streamer
    command: uv run python run_stream.py
    volumes:
      - ./services/data-pipeline:/app
    env_file: .env
    depends_on:
      - redis
      - data-pipeline
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - STREAM_SYMBOLS=EUR_USD,USD_JPY,XAU_USD
    restart: unless-stopped
    networks:
      - default
      - external

  strategy-core:
    build: ./services/strategy-core
    container_name: strategy-core
    volumes:
      - ./services/strategy-core:/app
    depends_on:
      - data-pipeline
    environment:
      - DATABASE_URL=postgresql://trader:trader@mtf-postgres:5432/mtf_db
      - REDIS_URL=redis://redis:6379/0
      - NUMBA_NUM_THREADS=1
      - OMP_NUM_THREADS=1
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G
    networks:
      - default
      - external

  ai-analyst:
    build: ./services/ai-analyst
    container_name: ai-analyst
    env_file: .env
    volumes:
      - ./services/ai-analyst:/app
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - default
      - external

  mtf-postgres:
    image: postgres:15
    container_name: mtf-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: mtf_db
    volumes:
      - ./infra/postgres_data:/var/lib/postgresql/data
    networks:
      - default
      - external

  # Already exists in localhost
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_storage:/qdrant/storage
  #   environment:
  #     - QDRANT__STORAGE__PATH=/qdrant/storage
  #     - QDRANT__SERVICE__GRPC_PORT=6334
  #     - QDRANT__LOGGING__LEVEL=info
  #     - QDRANT__SERVICE__API_KEY=pqFOJtR5GfwW0pzcrit6qVdgj0PuSa8jHWT7lnux3Dk=
  #     - QDRANT__CLUSTER__ENABLED=false

  # Manualy run
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - default
      - external

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - default
      - external

networks:
  external:
    external: true
    name: orignx-network
