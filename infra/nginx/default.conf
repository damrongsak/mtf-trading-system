server {
    listen 80;

    # Increase client body size to allow large file uploads
    client_max_body_size 50M;

    # Frontend Application
    # location / {
    #     proxy_pass http://frontend:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
        
    #     # WebSocket support (for Next.js dev)
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    # Data Pipeline Service (Direct Routing for Performance)
    # Maps /api/v1/data/* -> http://data-pipeline:8000/api/v1/*
    # Rewrite /api/v1/data/(.*) to /api/v1/$1
    location /api/v1/data/ {
        rewrite ^/api/v1/data/(.*) /api/v1/$1 break;
        proxy_pass http://data-pipeline:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # Allow long upload/processing times
    }

    # API Gateway Stream (WebSocket)
    location /api/v1/stream/ {
        proxy_pass http://api-gateway:8000/api/v1/stream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # API Gateway (General API)
    location /api/v1/ {
        proxy_pass http://api-gateway:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # API Gateway Signals (Direct Signal Access)
    location /api/v1/signal/ {
        proxy_pass http://api-gateway:8000/api/v1/signal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://api-gateway:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
